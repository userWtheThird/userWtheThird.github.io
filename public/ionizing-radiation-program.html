    const builtGroups = [];
    for (const card of document.querySelectorAll('#rfGroups > .card')) {
      const piSel = card.querySelector('[data-gpi]');
      const entries = [...card.querySelectorAll('[data-gisos] > .isoentry')].map(en => ({
        iso: en.querySelector('[data-eiso]').value,
        physicalForm: en.querySelector('[data-ephys]').value || undefined,
        limit: parseFloat(en.querySelector('[data-elim]').value) || 0,
        expUCi: parseFloat(en.querySelector('[data-eexp]').value) || 0,
        possUCi: parseFloat(en.querySelector('[data-eposs]').value) || 0,
        chemicalForm: en.querySelector('[data-echem]').value.trim() || undefined,
        description: en.querySelector('[data-edesc]').value.trim() || undefined
      })).filter(e => e.iso);
      const usersText = card.querySelector('[data-gusers]').value;
      if (!piSel.value || entries.length === 0) continue;
      const pi = piList.find(p => p.id === piSel.value);
      builtGroups.push({ id: uid('g'), piId: pi.id, piName: pi.name, isotopes: entries, users: parseUsersText(usersText) });
    }
    if (builtGroups.length === 0) return showErr('At least one PI group with a PI and an isotope is required.');

    let rua;
    if (editing) {
      rua = S.ruas.find(x => x.id === editing.id);
      const changes = diffRuaGroups(rua.groups, builtGroups);
      Object.assign(rua, { ruaNo, spaceID: space, type, department: dept, personInCharge: type === 'Individual' ? pic : undefined, expiryDate: expiry, safetyControls: controls, groups: builtGroups });
      if (changes.length) { rua.changeHistory = rua.changeHistory || []; rua.changeHistory.push({ id: uid('rh'), date: todayISO(), changes }); }
    } else {
      rua = { id: uid('rua'), ruaNo, spaceID: space, type, department: dept, personInCharge: type === 'Individual' ? pic : undefined, expiryDate: expiry, addedDate: todayISO(), safetyControls: controls, groups: builtGroups, changeHistory: [{ id: uid('rh'), date: todayISO(), changes: ['Authorization created'] }] };
      S.ruas.push(rua);
    }
    await persistRua(rua);
    S.ruaDetailId = rua.id;
    S.ruaEditId = null;
    toast('📋 RUA for ' + space + ' ' + (editing ? 'updated' : 'created'));
    renderAll();
  };
  document.getElementById('rfSubmit').onclick = submitHandler;
  document.getElementById('rfSubmitTop').onclick = submitHandler;
}

async function renewRua(id) {
  const u = S.ruas.find(x => x.id === id);
  if (!u) return;
  const oldExpiry = u.expiryDate || '';
  // Extend one year from the current expiry, or from today if already expired / unset
  u.expiryDate = (oldExpiry && daysUntil(oldExpiry) >= 0) ? addYearISO(oldExpiry) : addYearISO(todayISO());
  u.renewedDate = todayISO();
  u.changeHistory = u.changeHistory || [];
  u.changeHistory.push({ id: uid('rh'), date: todayISO(), changes: ['Renewed for 1 year — valid until ' + u.expiryDate] });
  await persistRua(u);
  toast('🔄 RUA for ' + u.spaceID + ' renewed until ' + u.expiryDate);
  renderAll();
}

async function toggleRuaStatus(id) {
  const u = S.ruas.find(x => x.id === id);
  if (!u) return;
  const newStatus = u.status === 'inactive' ? 'active' : 'inactive';
  u.status = newStatus;
  lsSave(LS_KEYS.ruas, S.ruas);
  toast((newStatus === 'inactive' ? '⊘ ' : '✓ ') + 'RUA for ' + u.spaceID + ' set to ' + newStatus);
  renderAll();
}

async function submitDose() {
  const errEl = document.getElementById('dErr'); const wrapEl = document.getElementById('dErrWrap');
  const name = document.getElementById('dName').value.trim();
  const dept = document.getElementById('dDept').value;
  const month = document.getElementById('dMonth').value;
  const dose = parseFloat(document.getElementById('dDose').value);
  const remarks = document.getElementById('dRemarks').value.trim();
  const showErr = m => { errEl.textContent = m; wrapEl.style.display = 'block'; };
  if (!name) return showErr('Name is required.');
  if (!month) return showErr('Month is required.');
  if (isNaN(dose) || dose < 0) return showErr('Enter a valid exposure reading.');

  const d = { id: uid('dose'), name, department: dept, month, exposure: dose, status: doseStatusOf(dose), remarks: remarks || undefined };
  S.doses.push(d);
  await persistDose(d);
  S.dosForm = { name: '', dept, month, dose: '', remarks: '' };
  toast('👤 Abnormal reading logged for ' + name + ' — status: ' + d.status.toUpperCase());
  renderAll();
}

function openRosterForm(id) {
  const r = id ? S.doseRoster.find(x => x.id === id) : null;

async function deleteRosterEntry(id) {

function wasteClassBadge(c) {

  return '<span class="bdg ' + cls + '">' + c + '</span>';

function nextTagNo() {
  const d = new Date();
  const base = String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  if (!S.waste.some(w => w.tagNo === base)) return base;
  let n = 2;
  while (S.waste.some(w => w.tagNo === base + '-' + n)) n++;
  return base + '-' + n;
}

function recordNoOf(date) {
  const d = (date || '').replace(/-/g, '');
  return 'WD-' + (d.length === 8 ? d.slice(2) : d);
}

// One disposal instance = containers disposed together (same date, person, method)
function disposalInstances() {
  const map = {};
  S.waste.filter(w => w.status === 'disposed').forEach(w => {
    const key = (w.disposedDate || '') + '|' + (w.disposedBy || '') + '|' + (w.disposalMethod || '');
    (map[key] = map[key] || { key, disposedDate: w.disposedDate, disposedBy: w.disposedBy, disposalMethod: w.disposalMethod, containers: [] }).containers.push(w);
  });
  return Object.values(map).sort((a, b) => (b.disposedDate || '').localeCompare(a.disposedDate || ''));
}

function collectionSummaryCard(month) {
  const monthRows = S.waste.filter(w => (w.collectedDate || '').startsWith(month));
  const byIso = {};
  monthRows.forEach(w => {
    byIso[w.isotope] = byIso[w.isotope] || { containers: 0, uci: 0 };

    byIso[w.isotope].uci += w.activityUCi || 0;
  });
  const isoKeys = Object.keys(byIso).sort((a, b) => byIso[b].uci - byIso[a].uci);

      isoKeys.map(k => '<tr><td class="mono" style="color:var(--txt);font-weight:600">' + k + '</td><td class="mono">' + byIso[k].containers + '</td><td class="mono">' + byIso[k].uci.toFixed(2) + '</td><td class="mono">' + (byIso[k].uci * UCII_TO_MBQ).toFixed(4) + '</td></tr>').join('') +

function newRenewalEvents(month) {
  const events = [];
  S.sources.forEach(s => {
    let inMonth = false;
    (s.licenceHistory || []).forEach(h => {
      if ((h.changedDate || '').startsWith(month)) {
        inMonth = true;
        const n = h.notes || '';
        const type = /renew/i.test(n) ? 'Renewal' : (/initial|new/i.test(n) ? 'New' : 'Updated');
        events.push({ date: h.changedDate, item: s.sourceName || s.equipmentDescription || '—', cat: s.category, type, licence: h.licenceNumber || s.licenceNumber || '', by: h.changedBy || '', notes: n });
      }
    });
    // Items registered without a licence history (e.g., unsealed sources) show up as new via addedDate
    if (!inMonth && (s.addedDate || '').startsWith(month)) {
      events.push({ date: s.addedDate, item: s.sourceName || s.equipmentDescription || '—', cat: s.category, type: 'New', licence: s.licenceNumber || '—', by: '', notes: 'Initial registration' });
    }
  });
  // RUAs are renewed annually — new authorizations and renewals show up here too
  S.ruas.forEach(u => {
    const label = (u.ruaNo || 'RUA') + ' — ' + (u.spaceID || '—') + ' (' + (u.type || '') + ')';
    if ((u.renewedDate || '').startsWith(month)) {
      events.push({ date: u.renewedDate, item: label, catLabel: 'RUA', type: 'Renewal', licence: '—', by: '', notes: 'Renewed annually — valid until ' + (u.expiryDate || '—') });
    } else if ((u.addedDate || '').startsWith(month)) {
      events.push({ date: u.addedDate, item: label, catLabel: 'RUA', type: 'New', licence: '—', by: '', notes: 'New authorization — valid until ' + (u.expiryDate || '—') });
    }
  });
  return events.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
}

function testSummaryData(month) {
  let leakDone = 0, leakPos = 0; const leakFlags = [];
  S.sources.filter(s => s.category === 'sealed').forEach(s => {
    (s.leakTestHistory || []).forEach(h => {
      if (typeof h === 'string') { if (h.startsWith(month)) leakDone++; return; }
      if (!(h.date || '').startsWith(month)) return;
      leakDone++;
      if (h.result === 'fail') leakFlags.push({ date: h.date, kind: 'Leak test', item: s.sourceName || s.equipmentDescription || '—', dept: deptOf(s), result: 'Positive', followUp: h.notes });
    });
  });
  leakPos = leakFlags.length;
  let swDone = 0; const swPosFlags = [], swAdalFlags = [];
  S.ruas.forEach(u => {
    (u.swipeHistory || []).forEach(x => {
      if (typeof x === 'string') { if (x.startsWith(month)) swDone++; return; }
      if (!(x.date || '').startsWith(month)) return;
      swDone++;
      var swRes = x.overallResult || x.result || '';
      if (swRes === 'positive') swPosFlags.push({ date: x.date, kind: 'Swipe test', item: u.spaceID, dept: u.department, result: 'Positive', followUp: x.followUp });
      else if (swRes === 'adal') swAdalFlags.push({ date: x.date, kind: 'Swipe test', item: u.spaceID, dept: u.department, result: 'Above ADAL', followUp: x.followUp });
    });
  });
  const flags = [...leakFlags, ...swPosFlags, ...swAdalFlags].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return { leakDone, leakPos, swDone, swPos: swPosFlags.length, swAdal: swAdalFlags.length, flags };
}

function renderWasteCollected() {
  const q = S.wasteSearch.toLowerCase();
  let rows = S.waste.filter(w => w.status !== 'disposed').filter(w => {
    if (S.wasteClassFilter && w.wasteClass !== S.wasteClassFilter) return false;
    if (q) {
      const hay = ((w.tagNo || '') + ' ' + (w.isotope || '') + ' ' + (w.department || '') + ' ' + (w.spaceID || '') + ' ' + (w.notes || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  // Sort
  if (S.wasteSortCol) {
    const dir = S.wasteSortDir === 'asc' ? 1 : -1;
    rows.sort((a, b) => {
      let va, vb;
      if (S.wasteSortCol === 'tagNo') { va = a.tagNo || ''; vb = b.tagNo || ''; }
      else if (S.wasteSortCol === 'wasteClass') { va = a.wasteClass || ''; vb = b.wasteClass || ''; }
      else if (S.wasteSortCol === 'form') { va = a.form || ''; vb = b.form || ''; }
      else if (S.wasteSortCol === 'isotope') { va = a.isotope || ''; vb = b.isotope || ''; }
      else if (S.wasteSortCol === 'activity') { va = a.activityUCi || 0; vb = b.activityUCi || 0; }
      else if (S.wasteSortCol === 'currentActivity') { va = currentActivityUCi(a); vb = currentActivityUCi(b); }
      else if (S.wasteSortCol === 'pctALI') { va = pctALI(a) || 0; vb = pctALI(b) || 0; }
      else if (S.wasteSortCol === 'department') { va = a.department || ''; vb = b.department || ''; }
      else if (S.wasteSortCol === 'spaceID') { va = a.spaceID || ''; vb = b.spaceID || ''; }
      else if (S.wasteSortCol === 'collectedDate') { va = a.collectedDate || ''; vb = b.collectedDate || ''; }
      else { va = ''; vb = ''; }
      if (va < vb) return -1 * dir; if (va > vb) return 1 * dir; return 0;
    });
  }

  let html = '<div class="tb">' +
    '<input class="sb" id="wasteSearch" placeholder="Search tag no., isotope, department, location…" value="' + esc(S.wasteSearch) + '">' +
    '<select class="sb" id="wasteClassFilter"><option value="">All Classes</option>' + WASTE_CLASSES.map(c => '<option ' + (S.wasteClassFilter === c ? 'selected' : '') + '>' + c + '</option>').join('') + '</select>' +
    '<button class="btn btn-o btn-s" id="wasteCsv">⬇ Export CSV</button>' +
    '<button class="btn btn-p" id="wasteAdd">+ Log Waste Collection</button></div>';

  // Containers in storage
  html += '<div class="section-title" style="margin-top:6px"><span class="acc">🛢</span> Waste Containers in Storage <span class="note">(' + rows.length + ' awaiting disposal)</span></div>';
  if (rows.length === 0) {
    html += '<div class="empty"><div class="big">🛢</div>No waste containers in storage.</div>';
  } else {
    const wSortIcon = col => S.wasteSortCol === col ? (S.wasteSortDir === 'asc' ? ' ▲' : ' ▼') : '';
    const wSortTh = (col, label) => '<th class="sortable" data-wsort="' + col + '" style="cursor:pointer;user-select:none">' + label + '<span class="note">' + wSortIcon(col) + '</span></th>';
    html += '<div class="tw"><table><thead><tr>' + wSortTh('tagNo', 'Tag No.') + wSortTh('wasteClass', 'Class') + wSortTh('form', 'Form') + wSortTh('isotope', 'Isotope') + wSortTh('collectedDate', 'Collected') + wSortTh('activity', 'Est. Activity') + wSortTh('currentActivity', 'Current Activity') + wSortTh('pctALI', '%ALI') + wSortTh('department', 'Department') + wSortTh('spaceID', 'Location') + '<th></th></tr></thead><tbody>' +
      rows.map(w => '<tr>' +
        '<td class="mono" style="color:var(--txt);font-weight:600">' + esc(w.tagNo) + '</td>' +
        '<td>' + wasteClassBadge(w.wasteClass) + '</td>' +
        '<td><span class="note" style="text-transform:uppercase">' + esc(w.form) + '</span></td>' +
        '<td class="mono">' + esc(w.isotope) + '</td>' +
        '<td>' + fmtDate(w.collectedDate) + '<div class="note">' + esc(w.collectedBy || '') + (w.notes ? ' — ' + esc(w.notes) : '') + '</div></td>' +
        '<td class="mono">' + estActivityCell(w) + '</td>' +
        '<td class="mono">' + currentActivityCell(w) + '</td>' +
        '<td>' + pctALICell(w) + '</td>' +
        '<td>' + esc(w.department) + '</td>' +
        '<td class="mono">' + esc(w.spaceID) + '</td>' +
        '<td style="white-space:nowrap"><button class="icobtn" data-wdisp="' + w.id + '" title="Record disposal">📤</button><button class="icobtn red" data-wdel="' + w.id + '" title="Delete record">🗑</button></td></tr>').join('') +
      '</tbody></table></div>';
  }
  html += '<div class="note" style="margin-top:10px">Waste is collected on request from authorized spaces — department and location are drawn from the Radiation Use Authorizations register. One container per isotope. Current Activity is decay-corrected from the collection date using the isotope half-life (see Isotope Reference); −% shows decay since collection. %ALI = (Current Activity ÷ Annual Limit on Intake) × 100 — colour-coded: green &lt;1%, amber 1–10%, red ≥10%. Use 📤 to record when a container is disposed.</div>';
  return html;
}

function renderWasteDisposed() {
  const q = S.wasteSearch.toLowerCase();
  const month = S.wasteDisposedMonth || '';
  let rows = S.waste.filter(w => w.status === 'disposed').filter(w => {
    if (S.wasteClassFilter && w.wasteClass !== S.wasteClassFilter) return false;
    if (month && !(w.disposedDate || '').startsWith(month)) return false;
    if (q) {
      const hay = ((w.tagNo || '') + ' ' + (w.isotope || '') + ' ' + (w.department || '') + ' ' + (w.spaceID || '') + ' ' + (w.disposalMethod || '') + ' ' + (w.disposalNotes || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => (b.disposedDate || '').localeCompare(a.disposedDate || ''));

  let html = '<div class="tb">' +
    '<input class="sb" id="wasteSearch" placeholder="Search tag no., isotope, department, method…" value="' + esc(S.wasteSearch) + '">' +
    '<select class="sb" id="wasteClassFilter"><option value="">All Classes</option>' + WASTE_CLASSES.map(c => '<option ' + (S.wasteClassFilter === c ? 'selected' : '') + '>' + c + '</option>').join('') + '</select>' +
    '<input type="month" id="wasteDisposedMonth" value="' + esc(month) + '" style="background:var(--bg);border:1px solid var(--brd);border-radius:6px;color:var(--txt);padding:6px 10px;font-size:12px">' +
    (month ? '<button class="btn btn-o btn-s" data-wdispmonth="">All Months</button>' : '') +
    '<button class="btn btn-o btn-s" id="wasteCsv">⬇ Export CSV</button></div>';

  // Disposal records — one standardized PDF per disposal event (may group several containers)
  const insts = disposalInstances().filter(ins => !month || (ins.disposedDate || '').startsWith(month));
  html += '<div class="section-title" style="margin-top:6px"><span class="acc">📄</span> Disposal Records <span class="note">(one standardized PDF per disposal event' + (month ? ' — ' + esc(month) + ')' : ')') + '</span></div>';
  if (insts.length === 0) {
    html += '<div class="empty"><div class="big">📄</div>No disposal records' + (month ? ' in ' + esc(month) : '') + '.</div>';
  } else {
    html += '<div class="tw"><table><thead><tr><th>Record No.</th><th>Disposal Date</th><th>Method</th><th>Disposed By</th><th>Containers</th><th>Total Activity</th><th></th></tr></thead><tbody>' +
      insts.map((ins, i) => { const u = ins.containers.reduce((a, w) => a + (w.activityUCi || 0), 0); return '<tr>' +
        '<td class="mono" style="color:var(--txt);font-weight:600">' + recordNoOf(ins.disposedDate) + '</td>' +
        '<td>' + fmtDate(ins.disposedDate) + '</td>' +
        '<td>' + esc(ins.disposalMethod || '—') + '</td>' +
        '<td>' + esc(ins.disposedBy || '—') + '</td>' +
        '<td class="mono">' + ins.containers.length + '</td>' +
        '<td class="mono">' + u.toFixed(2) + ' µCi<br><span class="note">' + (u * UCII_TO_MBQ).toFixed(4) + ' MBq · est. at collection</span></td>' +
        '<td><button class="icobtn" data-wpdf="' + i + '" title="Export standardized disposal PDF">📄 PDF</button></td></tr>'; }).join('') +
      '</tbody></table></div>';
  }

  // Individual containers, each linked to the disposal record (Record No.) it belongs to
  html += '<div class="section-title" style="margin-top:14px"><span class="acc">📤</span> Disposed Containers <span class="note">(' + rows.length + ' recorded' + (month ? ' in ' + esc(month) : '') + ')</span></div>';
  if (rows.length === 0) {
    html += '<div class="empty"><div class="big">📤</div>No disposed containers found' + (month ? ' in ' + esc(month) : '') + '.</div>';
  } else {
    html += '<div class="tw"><table><thead><tr><th>Tag No.</th><th>Record No.</th><th>Class</th><th>Form</th><th>Isotope</th><th>Activity at Disposal</th><th>Disposal Date</th><th>Method</th><th>Department</th></tr></thead><tbody>' +
      rows.map(w => '<tr>' +
        '<td class="mono" style="color:var(--txt);font-weight:600">' + esc(w.tagNo) + '</td>' +
        '<td class="mono">' + recordNoOf(w.disposedDate) + '</td>' +
        '<td>' + wasteClassBadge(w.wasteClass) + '</td>' +
        '<td><span class="note" style="text-transform:uppercase">' + esc(w.form) + '</span></td>' +
        '<td class="mono">' + esc(w.isotope) + '</td>' +
        '<td class="mono">' + activityAtDisposalCell(w) + '</td>' +
        '<td>' + fmtDate(w.disposedDate) + '<div class="note">' + esc(w.disposedBy || '') + (w.disposalNotes ? ' — ' + esc(w.disposalNotes) : '') + '</div></td>' +
        '<td>' + esc(w.disposalMethod || '—') + '</td>' +
        '<td>' + esc(w.department) + '</td></tr>').join('') +
      '</tbody></table></div>';
  }
    html += '<div class="note" style="margin-top:10px"><b>Disposal Records</b> group containers disposed together (same date, person and method) into one standardized PDF (Record No. WD-YYMMDD); <b>Disposed Containers</b> lists each container individually, linked to its Record No. “Activity at Disposal” is decay-corrected from the collection date to the disposal date using the isotope half-life; the original collection estimate is shown alongside.</div>';
  return html;
}

function renderWasteSummary() {
  const df = S.wasteDateFrom || '';
  const dt = S.wasteDateTo || '';
  const thisYear = new Date().getFullYear();
  const lastYear = thisYear - 1;

  // Compute per-isotope summary with date-range filtering
  const byIso = {};
  S.waste.forEach(w => {
    const iso = w.isotope || '—';
    byIso[iso] = byIso[iso] || { cn: 0, cu: 0, dn: 0, du: 0, sn: 0 };
    const collected = !df || w.collectedDate >= df;
    const collectedBefore = !dt || w.collectedDate <= dt;
    if (collected && collectedBefore) { byIso[iso].cn++; byIso[iso].cu += w.activityUCi || 0; }
    if (w.status === 'disposed') {
      const disposed = !df || (w.disposedDate || '') >= df;
      const disposedBefore = !dt || (w.disposedDate || '') <= dt;
      if (disposed && disposedBefore) { byIso[iso].dn++; byIso[iso].du += w.activityUCi || 0; }
    }
    if (w.status !== 'disposed' && collected && collectedBefore) byIso[iso].sn++;
  });
  const keys = Object.keys(byIso).sort((a, b) => byIso[b].cu - byIso[a].cu);
  const tot = keys.reduce((t, k) => ({ cn: t.cn + byIso[k].cn, cu: t.cu + byIso[k].cu, dn: t.dn + byIso[k].dn, du: t.du + byIso[k].du, sn: t.sn + byIso[k].sn }), { cn: 0, cu: 0, dn: 0, du: 0, sn: 0 });

  const rangeLabel = df && dt ? fmtDate(df) + ' — ' + fmtDate(dt) : df ? 'From ' + fmtDate(df) : dt ? 'Up to ' + fmtDate(dt) : 'All time';

  // Preset buttons
  const presets = [
    ['All Time', '', ''],
    ['This Year', thisYear + '-01-01', thisYear + '-12-31'],
    ['Last Year', lastYear + '-01-01', lastYear + '-12-31']
  ];
  const presetHtml = presets.map(function(pr) {
    var active = df === pr[1] && dt === pr[2];
    return '<button data-wpreset="' + pr[1] + '|' + pr[2] + '" style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;border:1px solid ' + (active ? 'var(--amb)' : 'var(--brd)') + ';color:' + (active ? 'var(--amb)' : 'var(--txt3)') + ';background:' + (active ? 'var(--amb-l)' : 'transparent') + ';cursor:pointer;transition:all .15s">' + pr[0] + '</button>';
  }).join('');

  let html = '<div class="card" style="padding:14px">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px">' +
    '<h3 style="margin:0"><span class="acc">📊</span> Waste Summary</h3>' +
    '<span class="note" style="font-size:11px">' + rangeLabel + '</span></div>';

  // Date range filter bar
  html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">' +
    '<label style="font-size:11px;font-weight:700;color:var(--txt3)">From</label>' +
    '<input type="date" id="wasteDateFrom" value="' + df + '" style="background:var(--bg);border:1px solid var(--brd);border-radius:6px;color:var(--txt);padding:3px 8px;font-size:12px">' +
    '<label style="font-size:11px;font-weight:700;color:var(--txt3)">To</label>' +
    '<input type="date" id="wasteDateTo" value="' + dt + '" style="background:var(--bg);border:1px solid var(--brd);border-radius:6px;color:var(--txt);padding:3px 8px;font-size:12px">' +
    '<div style="flex:1"></div>' +
    '<div style="display:flex;gap:4px">' + presetHtml + '</div></div>';

  if (keys.length === 0) {
    html += '<div class="empty" style="padding:18px">No waste activity in the selected period.</div>';
  } else {
    html += '<div class="tw"><table><thead><tr><th>Isotope</th><th>Collected</th><th>Collected (µCi)</th><th>Disposed</th><th>Disposed (µCi)</th><th>Still in Storage</th><th>Remaining (MBq)</th></tr></thead><tbody>' +
      keys.map(k => { const r = byIso[k]; const remU = r.cu - r.du; return '<tr>' +
        '<td class="mono" style="font-weight:600">' + esc(k) + '</td>' +
        '<td class="mono">' + r.cn + '</td><td class="mono">' + fmtUCi(r.cu) + '</td>' +
        '<td class="mono">' + r.dn + '</td><td class="mono">' + fmtUCi(r.du) + '</td>' +
        '<td class="mono" style="font-weight:700;color:' + (r.sn > 0 ? 'var(--amb)' : 'var(--grn)') + '">' + r.sn + '</td>' +
        '<td class="mono">' + (remU * UCII_TO_MBQ).toFixed(3) + '</td></tr>'; }).join('') +
      '</tbody><tfoot><tr style="border-top:2px solid var(--brd)"><td class="mono" style="font-weight:700;text-align:center">Total</td>' +
      '<td class="mono" style="font-weight:700;text-align:center">' + tot.cn + '</td><td class="mono" style="font-weight:700;text-align:center">' + fmtUCi(tot.cu) + '</td>' +
      '<td class="mono" style="font-weight:700;text-align:center">' + tot.dn + '</td><td class="mono" style="font-weight:700;text-align:center">' + fmtUCi(tot.du) + '</td>' +
      '<td class="mono" style="font-weight:700;text-align:center">' + tot.sn + '</td>' +
      '<td class="mono" style="font-weight:700;text-align:center">' + ((tot.cu - tot.du) * UCII_TO_MBQ).toFixed(3) + '</td></tr></tfoot></table></div>';
  }
  html += '<div class="note" style="margin-top:8px">Collected and disposed counts are filtered by the selected date range. "Still in Storage" shows containers collected within the range that have not yet been disposed. "Remaining" = collected − disposed activity.</div></div>';
  return html;
}

function exportDisposalPDF(idx) {
  const ins = disposalInstances()[idx];
  if (!ins) return;
  const recNo = recordNoOf(ins.disposedDate);
  // Build summary rows with decay-corrected net activity at disposal
  const grp = {};
  ins.containers.forEach(w => {
    const k = (w.isotope || '') + '|' + (w.form || '');
    const netMBq = activityAtUCi(w, ins.disposedDate) * UCII_TO_MBQ;
    grp[k] = grp[k] || { iso: w.isotope, form: w.form, n: 0, mbq: 0, ali: ALI_UCI[w.isotope] || 0 };
    grp[k].n++; grp[k].mbq += netMBq;
  });
  const rows = Object.values(grp);
  const totMBq = rows.reduce((a, r) => a + r.mbq, 0);
  const dest = /contractor/i.test(ins.disposalMethod || '') ? 'Collected by CMO Contractors as municipal waste' : (ins.disposalMethod || '');

  // Build detailed per-container rows
  const detailRows = ins.containers.map(w => {
    const origMBq = w.refActivityMBq || (w.activityUCi || 0) * UCII_TO_MBQ;
    const netMBq = activityAtUCi(w, ins.disposedDate) * UCII_TO_MBQ;
    const ali = ALI_UCI[w.isotope] || 0;
    const pctALI = ali > 0 ? (netMBq / (ali * UCII_TO_MBQ)) * 100 : 0;
    const t12 = HALF_LIFE_DAYS[w.isotope] || 0;
    const netDays = w.collectedDate && ins.disposedDate ? Math.round((Date.parse(ins.disposedDate) - Date.parse(w.collectedDate)) / 86400000) : 0;
    return '<tr><td>' + esc(w.tagNo) + '</td><td>' + fmtDate(w.collectedDate) + '</td><td>' + fmtDate(ins.disposedDate) + '</td><td>' + esc(w.isotope) + '</td><td>' + netDays + '</td><td>' + origMBq.toFixed(5) + '</td><td>' + netMBq.toFixed(8) + '</td><td>' + pctALI.toFixed(6) + '</td></tr>';
  }).join('');

  const doc = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + recNo + ' — Radioactive Waste Disposal Records</title><style>' +
    'body{font-family:"Segoe UI",Arial,sans-serif;color:#000;font-size:13px;padding:36px 48px}' +
    'h1{text-align:center;font-size:17px;text-decoration:underline;margin:0 0 30px}' +
    '.recno{float:right;border:1px solid #000;padding:4px 12px;font-size:12px}' +
    '.frow{display:flex;align-items:flex-end;gap:10px;margin:24px 0} .frow .lab{font-weight:600;white-space:nowrap}' +
    '.uline{flex:1;max-width:340px;border-bottom:1px solid #000;min-height:16px}' +
    'table{border-collapse:collapse;width:100%;margin:20px 0} th,td{border:1px solid #000;padding:7px 10px;font-size:12px;text-align:center} th{font-weight:700}' +
    '@media print{body{padding:20px}}' +
    '</style></head><body>' +
    '<h1>Radioactive Waste Disposal Records</h1>' +
    '<div class="recno">Record No.:&nbsp;&nbsp;<b>' + recNo + '</b></div><div style="clear:both"></div>' +
    '<div class="frow"><span class="lab">Date:</span><div class="uline">' + fmtDate(ins.disposedDate) + '</div></div>' +
    '<div class="frow"><span class="lab">Counting Instrument:</span><div class="uline"></div></div>' +
    '<div class="frow"><span class="lab">Worked by:</span><div class="uline">' + esc(ins.disposedBy || '') + '</div></div>' +
    '<table><thead><tr><th>Type of Radionuclide</th><th>Physical Form</th><th>No. of boxes / containers</th><th>Total Disposal Activity (estimated) (MBq)</th><th>% of ALI</th></tr></thead><tbody>' +
    rows.map(r => { const aliMBq = r.ali * UCII_TO_MBQ; const pct = aliMBq > 0 ? (r.mbq / aliMBq) * 100 : 0; return '<tr><td>' + esc(r.iso) + '</td><td>' + esc(r.form) + '</td><td>' + r.n + '</td><td>' + r.mbq.toFixed(2) + '</td><td>' + pct.toFixed(4) + '%</td></tr>'; }).join('') +
    '<tr><td colspan="3" style="text-align:right;font-weight:700">Total:</td><td style="font-weight:700">' + totMBq.toFixed(2) + '</td><td></td></tr>' +
    '</tbody></table>' +
    '<div class="frow"><span class="lab">Disposal Date:</span><div class="uline" style="max-width:240px">' + fmtDate(ins.disposedDate) + '</div></div>' +
    '<div class="frow"><span class="lab">Destination:</span><div class="uline" style="max-width:320px">' + esc(dest) + '</div></div>' +
    '<div class="frow"><span class="lab">Disposal by:</span><div class="uline" style="max-width:260px">' + esc(ins.disposedBy || '') + '</div></div>' +
    '<div class="frow"><span class="lab">Signature:</span><div class="uline"></div></div>' +
    '<h2 style="font-size:14px;text-align:center;margin-top:30px;text-decoration:underline">Disposal Records for Radioactive Wastes ' + rows.map(r => esc(r.iso)).join(' &amp; ') + ' Liquid on ' + fmtDate(ins.disposedDate) + '</h2>' +
    '<table><thead><tr><th>Tag No.</th><th>Ref Date</th><th>Disposal Date</th><th>Nuclide</th><th>Net Day</th><th>Original Activity (MBq)</th><th>Net Activity (MBq)</th><th>% of ALI</th></tr></thead><tbody>' +
    detailRows +
    '</tbody></table>' +
    '<scr' + 'ipt>window.onload=function(){setTimeout(function(){window.print()},300)}</scr' + 'ipt>' +
    '</body></html>';
  const win = window.open('', '_blank');
  if (!win) { toast('⚠ Pop-up blocked — allow pop-ups for this page to export the PDF'); return; }
  win.document.open(); win.document.write(doc); win.document.close();
  toast(' ' + recNo + ' opened — use the print dialog to save as PDF');
}

function exportWasteCSV() {
  if (S.wasteView === 'disposed') {
    const monthRows = S.waste.filter(w => w.status === 'disposed' && (w.disposedDate || '').startsWith(S.wasteMonth)).sort((a, b) => (a.disposedDate || '').localeCompare(b.disposedDate || ''));
    const out = [['Tag No.', 'Waste Class', 'Form', 'Isotope', 'Activity (uCi)', 'Activity (MBq)', 'Department', 'Location (SpaceID)', 'Disposal Date', 'Disposal Method', 'Disposed By', 'Disposal Notes']];
    monthRows.forEach(w => out.push([w.tagNo, w.wasteClass, w.form, w.isotope, (w.activityUCi || 0).toFixed(2), ((w.activityUCi || 0) * UCII_TO_MBQ).toFixed(4), w.department, w.spaceID, w.disposedDate || '', w.disposalMethod || '', w.disposedBy || '', w.disposalNotes || '']));
    downloadCSV('waste_disposed_' + S.wasteMonth + '.csv', out);
    toast('⬇ Disposal CSV exported for ' + S.wasteMonth + ' (' + monthRows.length + ' containers)');
    return;
  }
  const monthRows = S.waste.filter(w => (w.collectedDate || '').startsWith(S.wasteMonth)).sort((a, b) => (a.collectedDate || '').localeCompare(b.collectedDate || ''));
  const out = [['Tag No.', 'Waste Class', 'Form', 'Isotope', 'Activity (uCi)', 'Activity (MBq)', 'Department', 'Location (SpaceID)', 'Collected Date', 'Collected By', 'Notes']];
  monthRows.forEach(w => out.push([w.tagNo, w.wasteClass, w.form, w.isotope, (w.activityUCi || 0).toFixed(2), ((w.activityUCi || 0) * UCII_TO_MBQ).toFixed(4), w.department, w.spaceID, w.collectedDate, w.collectedBy || '', w.notes || '']));
  downloadCSV('waste_summary_' + S.wasteMonth + '.csv', out);
  toast('⬇ Waste CSV exported for ' + S.wasteMonth + ' (' + monthRows.length + ' containers)');
}

// Generic print-to-PDF: opens a clean print window with the report body
function printCard(title, bodyHtml) {
  const doc = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>' +
    'body{font-family:"Segoe UI",Arial,sans-serif;color:#000;font-size:12px;padding:32px 44px}' +
    'h1{font-size:16px;text-align:center;text-decoration:underline;margin:0 0 4px}' +
    '.sub{text-align:center;color:#444;font-size:11px;margin-bottom:16px}' +
    'h2{font-size:13px;margin:16px 0 4px}' +
    'table{border-collapse:collapse;width:100%;margin:10px 0} th,td{border:1px solid #000;padding:6px 9px;font-size:11px;text-align:center} th{background:#eee} td.l,th.l{text-align:left} tfoot td{font-weight:700}' +
    'p{font-size:11px;margin:8px 0}' +
    '@media print{body{padding:18px}}' +
    '</style></head><body>' +
    '<h1>' + esc(title) + '</h1>' +
    '<div class="sub">Ionizing Radiation Safety Program · Generated ' + fmtDate(todayISO()) + '</div>' +
    bodyHtml +
    '<scr' + 'ipt>window.onload=function(){setTimeout(function(){window.print()},300)}</scr' + 'ipt>' +
    '</body></html>';
  const win = window.open('', '_blank');
  if (!win) { toast('⚠ Pop-up blocked — allow pop-ups for this page to print'); return; }
  win.document.open(); win.document.write(doc); win.document.close();
  toast('🖨 ' + title + ' opened — use the print dialog to save as PDF');
}

function annualWasteData(y) {
  const inY = d => (d || '').startsWith(String(y));
  const byIso = {};
  S.waste.forEach(w => {
    const iso = w.isotope || '—';
    byIso[iso] = byIso[iso] || { cn: 0, cu: 0, dn: 0, du: 0, sn: 0 };
    if (inY(w.collectedDate)) { byIso[iso].cn++; byIso[iso].cu += w.activityUCi || 0; }
    if (w.status === 'disposed' && inY(w.disposedDate)) { byIso[iso].dn++; byIso[iso].du += w.activityUCi || 0; }
    if (w.status !== 'disposed') byIso[iso].sn++;
  });
  const keys = Object.keys(byIso).sort((a, b) => byIso[b].cu - byIso[a].cu);
  const tot = keys.reduce((t, k) => ({ cn: t.cn + byIso[k].cn, cu: t.cu + byIso[k].cu, dn: t.dn + byIso[k].dn, du: t.du + byIso[k].du, sn: t.sn + byIso[k].sn }), { cn: 0, cu: 0, dn: 0, du: 0, sn: 0 });
  return { keys, byIso, tot };
}

function printAnnualWaste() {
  const df = S.wasteDateFrom || '';
  const dt = S.wasteDateTo || '';
  const byIso = {};
  S.waste.forEach(w => {
    const iso = w.isotope || '—';
    byIso[iso] = byIso[iso] || { cn: 0, cu: 0, dn: 0, du: 0, sn: 0 };
    const collected = !df || w.collectedDate >= df;
    const collectedBefore = !dt || w.collectedDate <= dt;
    if (collected && collectedBefore) { byIso[iso].cn++; byIso[iso].cu += w.activityUCi || 0; }
    if (w.status === 'disposed') {
      const disposed = !df || (w.disposedDate || '') >= df;
      const disposedBefore = !dt || (w.disposedDate || '') <= dt;
      if (disposed && disposedBefore) { byIso[iso].dn++; byIso[iso].du += w.activityUCi || 0; }
    }
    if (w.status !== 'disposed' && collected && collectedBefore) byIso[iso].sn++;
  });
  const keys = Object.keys(byIso).sort((a, b) => byIso[b].cu - byIso[a].cu);
  const tot = keys.reduce((t, k) => ({ cn: t.cn + byIso[k].cn, cu: t.cu + byIso[k].cu, dn: t.dn + byIso[k].dn, du: t.du + byIso[k].du, sn: t.sn + byIso[k].sn }), { cn: 0, cu: 0, dn: 0, du: 0, sn: 0 });
  const rangeLabel = df && dt ? fmtDate(df) + ' — ' + fmtDate(dt) : df ? 'From ' + fmtDate(df) : dt ? 'Up to ' + fmtDate(dt) : 'All time';
  const b = '<table><thead><tr><th class="l">Isotope</th><th>Collected</th><th>Collected (µCi)</th><th>Disposed</th><th>Disposed (µCi)</th><th>Still in Storage</th><th>Remaining (MBq)</th></tr></thead><tbody>' +
    keys.map(k => { const r = byIso[k]; return '<tr><td class="l">' + esc(k) + '</td><td>' + r.cn + '</td><td>' + fmtUCi(r.cu) + '</td><td>' + r.dn + '</td><td>' + fmtUCi(r.du) + '</td><td>' + r.sn + '</td><td>' + ((r.cu - r.du) * UCII_TO_MBQ).toFixed(3) + '</td></tr>'; }).join('') +
    '</tbody><tfoot><tr><td class="l">Total</td><td>' + tot.cn + '</td><td>' + fmtUCi(tot.cu) + '</td><td>' + tot.dn + '</td><td>' + fmtUCi(tot.du) + '</td><td>' + tot.sn + '</td><td>' + ((tot.cu - tot.du) * UCII_TO_MBQ).toFixed(3) + '</td></tr></tfoot></table>' +
    '<p>Waste summary — ' + rangeLabel + '</p>';
  printCard('Waste Summary — ' + rangeLabel, b);
}

function emissionBadge(e) {
  const cls = e.includes('α') ? 'b-alpha' : e.includes('β') ? 'b-beta' : e.includes('γ') ? 'b-gamma' : 'b-communal';
  return '<span class="bdg ' + cls + '">' + e + '</span>';
}

function renderIsotopes() {
  const q = (S.isoSearch || '').toLowerCase();
  const hayOf = x => (x.iso + ' ' + x.name + ' ' + x.emission).toLowerCase()
    .replace(/β⁺/g, 'beta+ positron').replace(/β⁻/g, 'beta').replace(/β/g, 'beta')
    .replace(/α/g, 'alpha').replace(/γ/g, 'gamma');
  const rows = ISOTOPE_DATA.filter(x => !q || hayOf(x).includes(q));

  let html = '<div class="tb"><input class="sb" id="isoSearch" placeholder="Search isotope, name or emission…" value="' + esc(S.isoSearch || '') + '"></div>';

  html += '<div class="card"><h3><span class="acc">📖</span> Isotope Reference <span class="note">(' + rows.length + ' of ' + ISOTOPE_DATA.length + ' isotopes)</span></h3>';
  if (rows.length === 0) {
    html += '<div class="empty"><div class="big">📖</div>No isotopes match “' + esc(S.isoSearch) + '”.</div>';
  } else {
    html += '<div class="tw"><table><thead><tr><th>Isotope</th><th>Emission</th><th>Half-Life</th><th>Principal Emissions</th></tr></thead><tbody>' +
      rows.map(x => '<tr>' +
        '<td class="mono" style="color:var(--txt);font-weight:600">' + x.iso + '<div class="note">' + esc(x.name) + '</div></td>' +
        '<td>' + emissionBadge(x.emission) + '</td>' +
        '<td class="mono">' + x.halfLife + '</td>' +
        '<td class="mono">' + x.energy + '</td>' +
        '</tr>').join('') +
      '</tbody></table></div>';
  }
  html += '<div class="note" style="margin-top:10px">α = alpha · β⁻ = beta minus · β⁺ = positron · γ = gamma · EC = electron capture · IT = isomeric transition. Half-lives and principal emissions are standard literature values for planning and training — verify against source certificates for operational decisions.</div></div>';
  document.getElementById('mainContent').innerHTML = html;
}

    if (parts[1]) S.cat = parts[1];
    if (parts[0] === 'inventory') { S.detailId = null; S.invView = parts[2] || 'list'; }
    if (parts[0] === 'waste') { S.wasteView = parts[1] || 'collected'; S.wasteMonth = currentMonth(); }
    renderAll();
    return;
  }
  if (t.dataset.cat) { S.cat = t.dataset.cat; S.invIso = ''; S.selSources.clear(); S.detailId = null; renderAll(); return; }
  if (t.dataset.open) { S.detailId = t.dataset.open; renderInventory(); return; }
  if (t.dataset.rua) { S.ruaDetailId = t.dataset.rua; renderRua(); return; }
  if (t.hasAttribute('data-close')) { closeModal(); return; }
  if (t.id === 'invAdd' || t.id === 'invAdd2') { openSourceForm(S.cat); return; }
  if (t.id === 'invExport') { exportCSV(); return; }
  if (t.id === 'invImport') { importCSV(); return; }
  if (t.id === 'invRenewLicence') { openLicenceRenewal(); return; }
  if (t.id === 'batchVerify') { await batchMarkChecked(); return; }
  if (t.id === 'batchLicence') { openBatchLicenceRenewal(); return; }
  if (t.id === 'batchClear') { S.selSources.clear(); renderInventory(); return; }
  if (t.id === 'selAll') {
    const rows = filteredSources();
    if (t.checked) {
      rows.forEach(s => S.selSources.add(s.id));
    } else {
      S.selSources.clear();
    }
    renderInventory();
    return;
  }
  if (t.id === 'ruaAdd') { openRuaForm(null); return; }
  if (t.id === 'dSubmit') { await submitDose(); return; }
  if (t.id === 'rosterAdd') { openRosterForm(); return; }
    if (t.id === 'rosterToggle') { S.rosterOpen = !S.rosterOpen; renderDosimetry(); return; }
      if (t.dataset.msec) { S.mOpen[t.dataset.msec] = !S.mOpen[t.dataset.msec]; renderMonthlySummary(); return; }
  if (t.dataset.doctoggle) {
    if (t.dataset.doctoggle === 'lic') S.docLicOpen = !S.docLicOpen;
    if (t.dataset.doctoggle === 'corr') S.docCorrOpen = !S.docCorrOpen;
    if (t.dataset.doctoggle === 'rep') S.docRepOpen = !S.docRepOpen;
    renderDocuments(); return;
  }
  if (t.dataset.toggle === 'checkHistory') { S.checkHistoryOpen = !S.checkHistoryOpen; renderInventory(); return; }
  if (t.dataset.licfilter) { S.docLicFilter = t.dataset.licfilter; renderDocuments(); return; }
  if (t.dataset.licfile) {
    const url = licFileUrl(t.dataset.licfile);
    if (url) window.open(url, '_blank');
    else toast('📎 File access requires SharePoint connection — file: ' + t.dataset.licfile);
    return;
  }
  if (t.hasAttribute('data-licfolder')) {
    const url = licFolderUrl();
    if (url) window.open(url, '_blank');
    else toast('📂 Folder access requires SharePoint connection');
    return;
  }
  if (t.dataset.red) { openRosterForm(t.dataset.red); return; }
  if (t.dataset.rdel) { await deleteRosterEntry(t.dataset.rdel); return; }
  if (t.id === 'docsAdd') { openDocForm(); return; }
  if (t.dataset.dedit) { openDocForm(t.dataset.dedit); return; }
  if (t.dataset.ddel) { await deleteDoc(t.dataset.ddel); return; }
  if (t.id === 'qtrPrint') { printQuarterly(); return; }
  if (t.id === 'sumPrint') { printUnsealedSummary(); return; }
  if (t.dataset.wpreset) {
    const parts = t.dataset.wpreset.split('|');
    S.wasteDateFrom = parts[0]; S.wasteDateTo = parts[1]; renderWaste(); return;
  }
  if (t.id === 'wasteAdd') { openWasteForm(); return; }
  if (t.id === 'wasteCsv') { exportWasteCSV(); return; }
  if (t.dataset.wview) { S.wasteView = t.dataset.wview; S.wasteSearch = ''; renderWaste(); return; }
  if (t.hasAttribute('data-wpdf')) { exportDisposalPDF(+t.dataset.wpdf); return; }
  if (t.dataset.wdisp) { openDisposeForm(t.dataset.wdisp); return; }
  if (t.dataset.wdel) { await deleteWaste(t.dataset.wdel); return; }
  if (act === 'leakTest') { await performLeakTest(S.detailId); return; }
    if (act === 'swipeTest') { await performSwipeTest(S.detailId); return; }
  if (act === 'ruaSwipe') { await ruaSwipeTest(S.ruaDetailId); return; }
    if (t.dataset.swprint) { const [ruaId, idx] = t.dataset.swprint.split(':'); printSwipeReport(ruaId, parseInt(idx)); return; }
      if (t.dataset.adalprint) { const [ruaId, idx] = t.dataset.adalprint.split(':'); printAdalReport(ruaId, parseInt(idx)); return; }
  if (act === 'usageLog') { openUsageForm(S.detailId); return; }
  if (act === 'markChecked') { await markChecked(S.detailId); return; }
  if (act === 'iaCheck') { await markChecked(S.detailId); return; }
  if (act === 'licenceChange') { openLicenceChange(S.detailId); return; }
    if (act === 'iaEdit') { openSourceForm('apparatus', S.detailId); return; }
    if (act === 'sealedEdit') { openSourceForm('sealed', S.detailId); return; }
    if (act === 'iaToPU') { openPossessUseForm(S.detailId); return; }
    if (act === 'iaDecom') { openDecommissionForm(S.detailId); return; }
  if (act === 'ruaRenew') { await renewRua(S.ruaDetailId); return; }
  if (act === 'ruaEdit') { openRuaForm(S.ruas.find(x => x.id === S.ruaDetailId)); return; }
  if (act === 'ruaToggleStatus') { await toggleRuaStatus(S.ruaDetailId); return; }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'invSearch') { S.invSearch = e.target.value; renderInventory(); const el = document.getElementById('invSearch'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  if (e.target.id === 'invDept') { S.invDept = e.target.value; renderInventory(); }
  if (e.target.id === 'invIso') { S.invIso = e.target.value; renderInventory(); }
  if (e.target.id === 'ruaSearch') { S.ruaSearch = e.target.value; renderRua(); const el = document.getElementById('ruaSearch'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    if (e.target.id === 'ruaDept') { S.ruaDept = e.target.value; renderRua(); }
  if (e.target.id === 'dName') S.dosForm.name = e.target.value;
  if (e.target.id === 'dDept') S.dosForm.dept = e.target.value;
  if (e.target.id === 'dMonth') S.dosForm.month = e.target.value;
  if (e.target.id === 'dDose') S.dosForm.dose = e.target.value;
  if (e.target.id === 'dRemarks') S.dosForm.remarks = e.target.value;
  if (e.target.id === 'wasteSearch') { S.wasteSearch = e.target.value; renderWaste(); const el = document.getElementById('wasteSearch'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  if (e.target.id === 'wasteClassFilter') { S.wasteClassFilter = e.target.value; renderWaste(); }
  if (e.target.id === 'wasteMonth') { S.wasteMonth = e.target.value || currentMonth(); renderAll(); }
  if (e.target.id === 'rptYear') { S.rptYear = +e.target.value; renderAll(); }
  if (e.target.id === 'rptQ') { S.rptQ = parseInt(String(e.target.value).replace(/\D/g, ''), 10) || 1; renderAll(); }
  if (e.target.id === 'wasteDateFrom') { S.wasteDateFrom = e.target.value || ''; renderWaste(); }
  if (e.target.id === 'wasteDateTo') { S.wasteDateTo = e.target.value || ''; renderWaste(); }
  if (e.target.id === 'wasteDisposedMonth') { S.wasteDisposedMonth = e.target.value || ''; renderWaste(); }
  if (e.target.id === 'ruaShowInactive') { S.ruaShowInactive = e.target.checked; renderRua(); }
  if (e.target.id === 'isoSearch') { S.isoSearch = e.target.value; renderIsotopes(); const el = document.getElementById('isoSearch'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'invLicence') { S.invLicence = e.target.value; renderInventory(); }
});

// ════════════════════════════════════════════════════════════════
//  DOCUMENTS TAB
// ════════════════════════════════════════════════════════════════
function renderDocuments() {
  let html = '';

  // Licence register — collapsible, with type filter
  const allLic = S.sources.filter(s => s.licenceNumber);
  const filteredLic = S.docLicFilter === 'all' ? allLic : allLic.filter(s => s.category === S.docLicFilter);
  const licChev = S.docLicOpen ? '▾' : '▸';
  html += '<div class="card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" data-doctoggle="lic">' +
    '<h3 style="margin:0"><span class="acc">📜</span> Licence Register <span class="note">(' + allLic.length + ')</span></h3>' +
    '<span style="color:var(--note);font-size:18px">' + licChev + '</span></div>';
  if (S.docLicOpen) {
    const fBtns = [['all', 'All'], ['sealed', 'Sealed Sources'], ['apparatus', 'Irradiating Apparatus']].map(function(f) {
      var active = S.docLicFilter === f[0];
      return '<button data-licfilter="' + f[0] + '" style="font-size:11px;font-weight:700;padding:5px 12px;border-radius:6px;border:1px solid ' + (active ? 'var(--amber)' : 'var(--brd)') + ';color:' + (active ? 'var(--amber)' : 'var(--note)') + ';background:' + (active ? 'rgba(245,158,11,.12)' : 'transparent') + ';cursor:pointer;transition:all .15s">' + f[1] + '</button>';
    }).join('');
    html += '<div style="display:flex;gap:6px;margin:10px 0 8px">' + fBtns + '</div>';
    html += '<div class="note" style="margin-bottom:10px">Details are maintained on each source/apparatus record; this is the consolidated index. Multiple sources may share the same licence number (e.g., a site licence covering several sealed sources).</div>' +
      '<div class="tw"><table><thead><tr><th>Licence No.</th><th>Type</th><th>Item</th><th>Location</th><th>Expiry</th><th>Licence File</th></tr></thead><tbody>' +
      (filteredLic.length ? filteredLic.map(function(s) {
        const exp = s.licenceExpiryDate;
        return '<tr>' +
          '<td class="mono" style="font-weight:600">' + esc(s.licenceNumber) + '</td>' +
          '<td>' + (s.category === 'apparatus' ? 'Irradiating Apparatus' : 'Sealed Source') + '</td>' +
          '<td>' + esc(s.sourceName || s.equipmentDescription || '') + '</td>' +
          '<td class="mono">' + esc(s.spaceID || s.location || '—') + '</td>' +
          '<td>' + (exp ? fmtDate(exp) + (daysUntil(exp) <= 0 ? ' <span class="bdg b-alert" style="padding:1px 6px">' + (daysUntil(exp) < 0 ? 'EXPIRED' : 'EXPIRING') + '</span>' : '') : '<span class="note">—</span>') + '</td>' +
          '<td class="mono note" style="white-space:nowrap">' + (s.licenceFile ? '<a href="javascript:void(0)" data-licfile="' + esc(s.licenceFile) + '" style="color:var(--link);text-decoration:none;border-bottom:1px dotted var(--link)" title="Open file: ' + esc(s.licenceFile) + '">' + esc(s.licenceFile) + '</a> <button data-licfolder title="Open Licences folder" style="background:none;border:none;cursor:pointer;font-size:12px;padding:2px 4px;opacity:.7;vertical-align:middle" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.7">📂</button>' : '—') + '</td></tr>';
      }).join('') : '<tr><td colspan="6" style="text-align:center" class="note">No licensed items registered.</td></tr>') +
      '</tbody></table></div>';
  }
  html += '</div>';

  // Radiation Board correspondence — collapsible
  const docs = [...S.docs].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const corrChev = S.docCorrOpen ? '▾' : '▸';
  html += '<div class="card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" data-doctoggle="corr">' +
    '<h3 style="margin:0"><span class="acc">✉️</span> Radiation Board Correspondence <span class="note">(' + S.docs.length + ')</span></h3>' +
    '<span style="color:var(--note);font-size:18px">' + corrChev + '</span></div>';
  if (S.docCorrOpen) {
    html += '<div style="display:flex;justify-content:flex-end;margin:10px 0 8px"><button class="btn btn-p btn-s" id="docsAdd">+ Log Correspondence</button></div>' +
      '<div class="note" style="margin-bottom:10px">Applications, approvals, notifications and returns to/from the Radiation Board. Attach the PDF to each entry — in Phase 2 these live in the IRP Documents library.</div>' +
      '<div class="tw"><table><thead><tr><th>Date</th><th>Direction</th><th>Subject</th><th>Relates To</th><th>File</th><th></th></tr></thead><tbody>' +
      (docs.length ? docs.map(x => '<tr>' +
        '<td class="mono">' + fmtDate(x.date) + '</td>' +
        '<td><span class="bdg ' + (x.direction === 'Received' ? 'b-alert' : 'b-safe') + '" style="text-transform:none">' + esc(x.direction || 'Sent') + '</span></td>' +
        '<td><b>' + esc(x.subject) + '</b>' + (x.notes ? '<div class="note">' + esc(x.notes) + '</div>' : '') + '</td>' +
        '<td class="mono">' + esc(x.relatesTo || '—') + '</td>' +
        '<td class="mono note">' + esc(x.fileName || '—') + '</td>' +
        '<td style="white-space:nowrap"><button class="icobtn" data-dedit="' + x.id + '" title="Edit">✏️</button><button class="icobtn red" data-ddel="' + x.id + '" title="Delete">🗑</button></td></tr>').join('') :
        '<tr><td colspan="6" style="text-align:center" class="note">No correspondence logged yet.</td></tr>') +
      '</tbody></table></div>';
  }
  html += '</div>';

  // Reports & records index — collapsible
  const rep = [
    ['Quarterly Unsealed Report', 'Isotopes acquired & spent per quarter', 'inventory:unsealed:quarterly', 'Inventory → Unsealed → Quarterly Report'],
    ['Unsealed Inventory Summary', 'Location × isotope activity totals — annual renewal', 'inventory:unsealed:summary', 'Inventory → Unsealed → Inventory Summary'],
    ['Annual Waste Summary', 'Collected & disposed per isotope — use date range filter', 'waste:summary', 'Waste → Waste Summary'],
    ['Monthly Collection / Disposal Summaries', 'Month-by-month waste movements & renewals', 'monthly', 'Monthly Summary'],
    ['Waste Disposal Records', 'Per-disposal PDF in the standard format', 'waste', 'Waste → Disposed']
  ];
  const repChev = S.docRepOpen ? '▾' : '▸';
  html += '<div class="card">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" data-doctoggle="rep">' +
    '<h3 style="margin:0"><span class="acc">📄</span> Reports & Records for Submission</h3>' +
    '<span style="color:var(--note);font-size:18px">' + repChev + '</span></div>';
  if (S.docRepOpen) {
    html += '<div class="note" style="margin-bottom:10px">Generated live from the data. Open the source view and use 🖨 Print / PDF (or the disposal PDF export) to produce the submission copy.</div>' +
      '<div class="tw"><table><thead><tr><th>Report</th><th>Used For</th><th>Where</th><th></th></tr></thead><tbody>' +
      rep.map(r => '<tr><td><b>' + r[0] + '</b></td><td class="note">' + r[1] + '</td><td class="note">' + r[3] + '</td>' +
        '<td><button class="btn btn-o btn-s" data-go="' + r[2] + '">Open</button></td></tr>').join('') +
      '</tbody></table></div>';
  }
  html += '</div>';

  document.getElementById('mainContent').innerHTML = html;
}

function openDocForm(id) {
  const x = id ? S.docs.find(d => d.id === id) : null;
  const html = '<div class="mback" id="mback"><div class="modal">' +
    '<div class="mh"><h3><span class="acc">✉️</span> ' + (x ? 'Edit' : 'Log') + ' Radiation Board Correspondence</h3><button class="x" data-close>✕</button></div>' +
    '<div style="display:grid;gap:12px">' +
    '<div class="fg"><div class="fi"><label>Date *</label><input id="dfDate" type="date" value="' + esc(x ? x.date : todayISO()) + '"></div>' +
    '<div class="fi"><label>Direction *</label><select id="dfDir">' + ['Sent', 'Received'].map(v => '<option ' + (x && x.direction === v ? 'selected' : '') + '>' + v + '</option>').join('') + '</select></div></div>' +
    '<div class="fi f"><label>Subject *</label><input id="dfSubject" value="' + esc(x ? x.subject : '') + '" placeholder="e.g., Licence renewal application — sealed sources"></div>' +
    '<div class="fg"><div class="fi"><label>Relates To</label><input id="dfRelates" class="mono" value="' + esc(x ? (x.relatesTo || '') : '') + '" placeholder="Licence no. / Space ID"></div>' +
    '<div class="fi"><label>PDF File Name</label><input id="dfFile" class="mono" value="' + esc(x ? (x.fileName || '') : '') + '" placeholder="letter_2026.pdf"></div></div>' +
    '<div class="fi f"><label>Notes</label><input id="dfNotes" value="' + esc(x ? (x.notes || '') : '') + '" placeholder="e.g., submitted with annual return"></div>' +
    '<div class="fi f" id="dfErrWrap" style="display:none"><div style="background:var(--red-l);color:var(--red);border-radius:6px;padding:8px 12px;font-size:11px" id="dfErr"></div></div>' +
    '</div>' +
    '<div class="mbtns"><button class="btn btn-o" data-close>Cancel</button><button class="btn btn-p" id="dfSubmit">' + (x ? 'Save Changes' : 'Log Correspondence') + '</button></div>' +
    '</div></div>';
  document.getElementById('modalHost').innerHTML = html;

  document.getElementById('dfSubmit').onclick = async () => {
    const errEl = document.getElementById('dfErr'); const wrapEl = document.getElementById('dfErrWrap');
    const showErr = m => { errEl.textContent = m; wrapEl.style.display = 'block'; };
    const date = document.getElementById('dfDate').value;
    const subject = document.getElementById('dfSubject').value.trim();
    if (!date) return showErr('Date is required.');
    if (!subject) return showErr('Subject is required.');
    const entry = x || { id: uid('doc') };
    entry.date = date; entry.direction = document.getElementById('dfDir').value; entry.subject = subject;
    entry.relatesTo = document.getElementById('dfRelates').value.trim() || undefined;
    entry.fileName = document.getElementById('dfFile').value.trim() || undefined;
    entry.notes = document.getElementById('dfNotes').value.trim() || undefined;
    if (!x) S.docs.push(entry);
    await persistDoc(entry);
    closeModal();
    toast('✉️ Correspondence ' + (x ? 'updated' : 'logged') + ' — ' + subject);
    renderAll();
  };
}

async function deleteDoc(id) {
  const x = S.docs.find(d => d.id === id);
  if (!x) return;
  if (!confirm('Delete correspondence "' + x.subject + '"? This cannot be undone.')) return;
  S.docs = S.docs.filter(d => d.id !== id);
  lsSave(LS_KEYS.docs, S.docs);
  await deleteDocSP(x);
  toast('✉️ Correspondence deleted');
  renderAll();
}

// Close modal on backdrop click
document.addEventListener('mousedown', (e) => {
  if (e.target.id === 'mback') closeModal();
});

// ════════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════════
//  THEME (light / dark)
function isLightTheme() { return document.documentElement.classList.contains('light'); }
function applyThemeUI() {
  const btn = document.getElementById('themeToggle');
  if (btn) { btn.textContent = isLightTheme() ? '🌙' : '☀️'; btn.title = isLightTheme() ? 'Switch to dark theme' : 'Switch to light theme'; }
}
function toggleTheme() {
  document.documentElement.classList.toggle('light');
  try { localStorage.setItem('IRP_THEME', isLightTheme() ? 'light' : 'dark'); } catch (e) {}
  applyThemeUI();
}

async function init() {
  applyThemeUI();
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  await initSharePoint();
  let spLoaded = false;
  if (isSPMode) {
    try { await loadFromSP(); spLoaded = true; } catch (e) { console.error('SharePoint load failed, falling back to localStorage', e); }
  }
  if (!spLoaded) {
    S.sources = lsLoad(LS_KEYS.sources, SEED_SOURCES);
    S.doses = lsLoad(LS_KEYS.doses, SEED_DOSES);
    S.ruas = lsLoad(LS_KEYS.ruas, SEED_RUAS);
    S.waste = lsLoad(LS_KEYS.waste, SEED_WASTE);
    S.doseRoster = lsLoad(LS_KEYS.doseRoster, SEED_DOSE_ROSTER);
    S.docs = lsLoad(LS_KEYS.docs, SEED_DOCS);
  }
  const pill = document.getElementById('syncPill');
  if (isSPMode && spLoaded) {
    pill.classList.remove('local'); pill.classList.add('sp');
    document.getElementById('syncLabel').textContent = 'SharePoint connected';
  } else {
    document.getElementById('syncLabel').textContent = isSPMode ? 'SharePoint detected — load failed, using local copy' : 'Local mode — data saved in this browser';
  }
  renderAll();
  saveAll();
}

init();
</script>
