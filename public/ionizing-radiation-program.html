<script>
// ══════════ SHAREPOINT CONFIGURATION ══════════
// Set this to your SharePoint site URL (e.g., 'https://yourcompany.sharepoint.com/sites/yoursite')
const SP_SITE_URL = ''; // Leave empty to auto-detect (e.g. when hosted in a SharePoint page)
const SP_LISTS = {
  sources:    'IRP_Sources',
  dosimetry:  'IRP_Dosimetry',
  ruas:       'IRP_RUAs',
  locations:  'IRP_Locations',
  persons:    'IRP_Persons',
  waste:      'IRP_Waste',
  doseRoster: 'IRP_DoseRoster',
  docs:       'IRP_Documents'
};
// Document library folders (setup pending) — used by Power Automate flows for file storage:
//   'IRP Documents/Licences'    → apparatus licence PDFs
//   'IRP Documents/LeakTests'   → leak-test reports
//   'IRP Documents/Invoices'    → dosimetry invoices
//   'IRP Documents/Waste'       → waste manifests / disposal records

// SharePoint REST API helpers
let isSPMode = false;
let spContext = null;

async function initSharePoint() {
  if (SP_SITE_URL || window._spPageContextInfo) {
    try {
      spContext = window._spPageContextInfo || { webAbsoluteUrl: SP_SITE_URL };
      isSPMode = true;
      console.log('SharePoint mode enabled');
      return true;
    } catch (e) {
      console.log('SharePoint detection failed, using localStorage');
      return false;
    }
  }
  return false;
}

async function spGetListItems(listName) {
  if (!isSPMode) return null;
  const url = `${spContext.webAbsoluteUrl}/_api/web/lists/getbytitle('${listName}')/items?$top=5000`;
  const resp = await fetch(url, {
    headers: { 'Accept': 'application/json;odata=verbose' },
    credentials: 'include'
  });
  if (!resp.ok) throw new Error(`Failed to get ${listName}: ${resp.statusText}`);
  const data = await resp.json();
  return data.d.results;
}

async function spCreateListItem(listName, item) {
  if (!isSPMode) return null;
  const url = `${spContext.webAbsoluteUrl}/_api/web/lists/getbytitle('${listName}')/items`;
  const resp = await fetch(url, {
    method: 'POST',
    headers: {
      'Accept': 'application/json;odata=verbose',
      'Content-Type': 'application/json;odata=verbose',
      'X-RequestDigest': await spGetDigest()
    },
    credentials: 'include',
    body: JSON.stringify(item)
  });
  if (!resp.ok) throw new Error(`Failed to create item: ${resp.statusText}`);
  return await resp.json();
}

async function spUpdateListItem(listName, itemId, item) {
  if (!isSPMode) return null;
  const url = `${spContext.webAbsoluteUrl}/_api/web/lists/getbytitle('${listName}')/items(${itemId})`;
  const resp = await fetch(url, {
    method: 'POST',
    headers: {
      'Accept': 'application/json;odata=verbose',
      'Content-Type': 'application/json;odata=verbose',
      'X-RequestDigest': await spGetDigest(),
      'IF-MATCH': '*',
      'X-HTTP-Method': 'MERGE'
    },
    credentials: 'include',
    body: JSON.stringify(item)
  });
  if (!resp.ok) throw new Error(`Failed to update item: ${resp.statusText}`);
  return await resp.json();
}

async function spDeleteListItem(listName, itemId) {
  if (!isSPMode) return null;
  const url = `${spContext.webAbsoluteUrl}/_api/web/lists/getbytitle('${listName}')/items(${itemId})`;
  const resp = await fetch(url, {
    method: 'POST',
    headers: {
      'Accept': 'application/json;odata=verbose',
      'X-RequestDigest': await spGetDigest(),
      'IF-MATCH': '*',
      'X-HTTP-Method': 'DELETE'
    },
    credentials: 'include'
  });
  if (!resp.ok) throw new Error(`Failed to delete item: ${resp.statusText}`);
}

async function spGetDigest() {
  const resp = await fetch(`${spContext.webAbsoluteUrl}/_api/contextinfo`, {
    method: 'POST',
    headers: { 'Accept': 'application/json;odata=verbose' },
    credentials: 'include'
  });
  const data = await resp.json();
  return data.d.GetContextWebInformation.FormDigestValue;
}

// Debug function — call from browser console: debugSP()
function debugSP() {
  console.log('=== SharePoint Debug Info ===');
  console.log('isSPMode:', isSPMode);
  console.log('spContext:', spContext);
  console.log('SP_SITE_URL:', SP_SITE_URL);
  console.log('SP_LISTS:', SP_LISTS);
  console.log('Sources:', S.sources.length, '| Doses:', S.doses.length, '| RUAs:', S.ruas.length, '| Waste containers:', S.waste.length);
  console.log('===========================');
  return { isSPMode, spContext, sources: S.sources.length, doses: S.doses.length, ruas: S.ruas.length, waste: S.waste.length };
}
</script>
<style>
:root{
  --bg:#020617; --bg2:#0f172a; --card:#0f172a; --card2:#1e293b; --brd:#1e293b; --brd2:#334155;
  --txt:#e2e8f0; --txt2:#94a3b8; --txt3:#64748b;
  --amb:#f59e0b; --amb-d:#b45309; --amb-l:rgba(245,158,11,.15); --amb-b:rgba(217,119,6,.3);
  --grn:#10b981; --grn-l:rgba(16,185,129,.15);
  --red:#ef4444; --red-l:rgba(239,68,68,.15);
  --blu:#3b82f6; --blu-l:rgba(59,130,246,.15);
  --cyn:#06b6d4; --cyn-l:rgba(6,182,212,.15);
  --pur:#a855f7; --pur-l:rgba(168,85,247,.15);

/* Light theme overrides */
:root.light{
  --bg:#f1f5f9; --bg2:#ffffff; --card:#ffffff; --card2:#f8fafc; --brd:#e2e8f0; --brd2:#cbd5e1;
  --txt:#0f172a; --txt2:#475569; --txt3:#64748b;
  --amb:#d97706; --amb-d:#b45309; --amb-l:rgba(217,119,6,.12); --amb-b:rgba(217,119,6,.35);
  --grn:#059669; --grn-l:rgba(5,150,105,.12);
  --red:#dc2626; --red-l:rgba(220,38,38,.1);
  --blu:#2563eb; --blu-l:rgba(37,99,235,.12);
  --cyn:#0891b2; --cyn-l:rgba(8,145,178,.12);
  --pur:#9333ea; --pur-l:rgba(147,51,234,.12);
  --link:#2563eb; --note:#64748b;
}
:root.light tbody tr.sel:hover{background:rgba(226,232,240,.7)}
:root.light .mback{background:rgba(15,23,42,.35)}
:root.light .modal{box-shadow:0 20px 60px rgba(15,23,42,.18)}
:root.light #toast{box-shadow:0 8px 24px rgba(15,23,42,.15)}
:root.light .hdr .logo{box-shadow:0 2px 8px rgba(15,23,42,.15)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:13px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:4px}

/* Header */
.hdr{background:var(--bg2);border-bottom:1px solid var(--brd);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hdr .left{display:flex;align-items:center;gap:10px}
.hdr .logo{width:32px;height:32px;background:linear-gradient(135deg,#d97706,#b45309);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.hdr h1{font-size:14px;font-weight:700;letter-spacing:-.01em;display:inline}
.hdr .sub{font-size:10px;color:var(--txt3);margin-left:6px;display:inline}
.hdr-back{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--bg);border:1px solid var(--brd);cursor:pointer;color:var(--txt);font-size:14px;transition:background .2s;text-decoration:none}
.hdr-back:hover{background:var(--brd)}
.sync-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:5px 12px;border-radius:999px;border:1px solid var(--brd2);background:var(--bg)}
.sync-pill .dot{width:7px;height:7px;border-radius:50%}
.sync-pill.sp .dot{background:var(--grn)} .sync-pill.local .dot{background:var(--amb)}

/* Compliance strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:16px 24px;background:var(--bg);border-bottom:1px solid var(--brd)}
.strip .item{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.15s}
.strip .item:hover{border-color:var(--amb-b)}
.strip .n{font-family:var(--mono);font-size:22px;font-weight:700;min-width:30px;text-align:center}
.strip .l{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;line-height:1.4}
.n-red{color:var(--red);background:var(--red-l)} .n-amb{color:var(--amb);background:var(--amb-l)} .n-grn{color:var(--grn);background:var(--grn-l)}
.strip .n.bub{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* Tabs */
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--brd);padding:0 16px;overflow:visible}
.tab{padding:11px 18px;background:none;border:none;font-size:12px;font-weight:600;color:var(--txt3);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:.15s}
.tab:hover{color:var(--amb)}
.tab.active{color:var(--amb);border-bottom-color:var(--amb)}
.tab .cnt{background:var(--brd);color:var(--txt2);font-size:10px;padding:1px 7px;border-radius:999px;font-family:var(--mono)}
.tab.active .cnt{background:var(--amb-l);color:var(--amb)}

/* Inventory dropdown menu */
.tabdd{position:relative;display:flex}
.tab .car{font-size:8px;opacity:.7}
.tabdd-menu{display:none;position:absolute;top:100%;left:0;z-index:60;min-width:250px;background:var(--bg2);border:1px solid var(--brd2);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;cursor:default}
.tabdd:hover .tabdd-menu,.tabdd.open .tabdd-menu{display:block}
.ddh{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--txt2);text-transform:uppercase;padding:9px 10px 4px}
.ddh .cnt{background:var(--brd);color:var(--txt2);font-size:10px;padding:1px 7px;border-radius:999px;font-family:var(--mono)}
.ddi{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:7px 10px 7px 26px;border:none;background:none;border-radius:6px;font-size:12px;font-weight:600;color:var(--txt2);cursor:pointer;text-align:left}
.ddi:hover{background:var(--amb-l);color:var(--amb)}
.ddi.on{color:var(--amb)}

.ctn{max-width:1280px;margin:0 auto;padding:20px 24px}

/* Category nav (inventory) */
.catnav{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.cat{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:10px 16px;font-size:12px;font-weight:600;color:var(--txt2);transition:.15s}
.cat:hover{border-color:var(--brd2)}
.cat.active{background:var(--amb-l);border-color:var(--amb-b);color:var(--amb)}
.cat .cn{font-family:var(--mono);font-size:11px;background:var(--bg);border-radius:999px;padding:1px 8px}

/* Toolbar */
.tb{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.sb{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--brd);border-radius:var(--r);font-size:12px;background:var(--bg2);color:var(--txt)}
.sb:focus{outline:none;border-color:var(--amb)}
select.sb{width:auto;flex:none}

/* Buttons */
.btn{padding:8px 16px;border:none;border-radius:var(--r);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn-p{background:var(--amb-d);color:#fff}.btn-p:hover{background:var(--amb);color:#0f172a}
.btn-o{background:none;border:1px solid var(--brd2);color:var(--txt2)}.btn-o:hover{border-color:var(--amb);color:var(--amb)}
.btn-g{background:var(--grn);color:#031b12}.btn-g:hover{filter:brightness(1.1)}
.btn-r{background:var(--red);color:#fff}.btn-r:hover{filter:brightness(1.1)}
.btn-s{padding:4px 10px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Batch bar */
.batchbar{display:flex;align-items:center;gap:12px;background:var(--blu-l);border:1px solid rgba(59,130,246,.4);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-size:12px}

/* Tables */
.tw{overflow-x:auto;border:1px solid var(--brd);border-radius:var(--r);background:var(--bg2)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{text-align:left;padding:10px 14px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);background:var(--bg);border-bottom:1px solid var(--brd);white-space:nowrap}
thead th.sortable:hover{color:var(--txt);background:var(--bg2)}
tbody td{padding:10px 14px;border-bottom:1px solid var(--brd);color:var(--txt2);vertical-align:middle}
tbody tr{transition:.1s}
tbody tr:last-child td{border-bottom:none}
tbody tr.sel{cursor:pointer} tbody tr.sel:hover{background:rgba(30,41,59,.6)}
tbody tr.hl{background:var(--amb-l)}
.mono{font-family:var(--mono)}

/* Badges */
.bdg{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.bdg .d{width:6px;height:6px;border-radius:50%}
.b-safe{background:var(--grn-l);color:var(--grn)} .b-safe .d{background:var(--grn)}
.b-alert{background:var(--red-l);color:var(--red)} .b-alert .d{background:var(--red)}
.b-due{background:var(--amb-l);color:var(--amb)} .b-due .d{background:var(--amb)}
.b-expired{background:var(--red-l);color:var(--red)} .b-expired .d{background:var(--red)}
.b-expiring{background:var(--amb-l);color:var(--amb)} .b-expiring .d{background:var(--amb)}
.b-valid{background:var(--blu-l);color:var(--blu)} .b-valid .d{background:var(--blu)}
.b-mute{background:var(--brd);color:var(--txt3)} .b-mute .d{background:var(--txt3)}
.b-normal{background:var(--grn-l);color:var(--grn)} .b-caution{background:var(--amb-l);color:var(--amb)} .b-critical{background:var(--red-l);color:var(--red)}
.b-overdue{background:var(--red-l);color:var(--red)} .b-ok{background:var(--grn-l);color:var(--grn)}
.b-communal{background:var(--cyn-l);color:var(--cyn)} .b-individual{background:var(--pur-l);color:var(--pur)}
.b-alpha{background:var(--pur-l);color:var(--pur)} .b-beta{background:var(--amb-l);color:var(--amb)} .b-gamma{background:var(--blu-l);color:var(--blu)}

.card{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:18px;margin-bottom:14px}

.card h3 .acc{color:var(--amb)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kv{font-size:12px}
.kv .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);margin-bottom:3px;font-weight:700}
.kv .v{color:var(--txt)}

/* Forms */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fi{display:flex;flex-direction:column}
.fi.f{grid-column:1/-1}
.fi label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--txt2);margin-bottom:4px}
.fi input,.fi select,.fi textarea{padding:8px 10px;background:var(--bg);border:1px solid var(--brd);border-radius:6px;font-size:12px;color:var(--txt)}
.fi input:focus,.fi select:focus,.fi textarea:focus{outline:none;border-color:var(--amb)}
.fi .hint{font-size:10px;color:var(--txt3);margin-top:3px}
.fi input[type=file]{padding:6px}

/* Layout helpers */
.layout2{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media(max-width:1000px){.layout2{grid-template-columns:1fr}}
/* Split layout: table left, sticky detail panel right */
.split-layout{display:grid;grid-template-columns:1fr 2fr;gap:16px;align-items:start}
.split-layout .split-main{min-height:0}
.split-layout .split-detail{position:sticky;top:16px;max-height:calc(100vh - 120px);overflow-y:auto;scrollbar-width:thin}

.sidecard{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:16px}
.empty{text-align:center;padding:40px 20px;color:var(--txt3);font-size:12px}

/* Modal */
.mback{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;overflow-y:auto}

.modal.wide{max-width:640px}

.modal .mh h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.modal .x{background:none;border:none;color:var(--txt3);font-size:18px;padding:4px}
.modal .x:hover{color:var(--txt)}
.mbtns{display:flex;gap:10px;margin-top:18px}
.mbtns .btn{flex:1;justify-content:center}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg2);border:1px solid var(--amb-b);border-left:3px solid var(--amb);border-radius:var(--r);padding:12px 18px;font-size:12px;z-index:200;transition:.3s;opacity:0;max-width:90vw}

/* Footer */
.ftr{padding:16px 24px;text-align:center;font-size:11px;color:var(--txt3);border-top:1px solid var(--brd);margin-top:20px}

/* Dose bars */
.dosebar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:5px}
.dosebar .fill{height:100%;border-radius:3px}

/* RUA cards */
.ruagrid{display:flex;flex-direction:column;gap:10px}
.ruacard{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:16px;cursor:pointer;transition:.15s}
.ruacard:hover{border-color:var(--amb-b)}
.ruacard.hl{background:var(--amb-l);border-color:var(--amb-b)}

/* Small icon buttons */
.icobtn{background:none;border:1px solid var(--brd2);color:var(--txt2);border-radius:6px;padding:4px 8px;font-size:11px;display:inline-flex;align-items:center;gap:5px}
.icobtn:hover{border-color:var(--amb);color:var(--amb)}
.icobtn.red:hover{border-color:var(--red);color:var(--red)}

/* Detail history list */
.hist{display:flex;flex-direction:column;gap:6px;max-height:140px;overflow-y:auto}
.hist .hi{background:var(--bg);border:1px solid var(--brd);border-radius:6px;padding:7px 10px;font-size:11px;display:flex;justify-content:space-between;gap:8px}

/* Slider */
input[type=range]{width:100%;accent-color:var(--amb)}

.section-title{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title .acc{color:var(--amb)}
.note{font-size:10px;color:var(--txt3);line-height:1.5}
.chk{width:14px;height:14px;accent-color:var(--amb)}
</style>

<script>
'use strict';
// ════════════════════════════════════════════════════════════════

// Half-lives in days (365.25 d/y) for decay correction of stored waste
const HALF_LIFE_DAYS = { 'H-3':4500, 'C-14':2092883, 'P-32':14.29, 'S-35':87.4, 'Cl-36':109940250, 'Ca-45':162.6, 'Ni-63':36561, 'Sr-90':10519, 'I-125':59.4, 'Cr-51':27.7, 'Mn-54':312.3, 'Fe-55':997, 'Fe-59':44.5, 'Co-60':1925, 'Zn-65':244, 'Na-22':950, 'Tc-99m':0.2504, 'F-18':0.0762, 'Ga-68':0.047, 'C-11':0.0142, 'Ge-68':270.8, 'Cs-137':11020, 'Am-241':157861, 'Pu-239':8806173, 'U-238':1.6327e12, 'Ra-226':584400 };

// Annual Limits on Intake (ALI) in microCi — from 10 CFR 20 Appendix B
// ALI is the activity that would result in a committed dose of 5 rem (0.05 Sv)
const ALI_UCI = { 'H-3':1000, 'C-14':1000, 'P-32':200, 'S-35':1000, 'Cl-36':1000, 'Ca-45':2000, 'Ni-63':9000, 'Sr-90':200, 'I-125':100, 'Cr-51':3000, 'Mn-54':3000, 'Fe-55':3000, 'Fe-59':300, 'Co-60':100, 'Zn-65':1000, 'Na-22':100, 'Tc-99m':10000, 'F-18':10000, 'Ga-68':10000, 'C-11':10000, 'Ge-68':100, 'Cs-137':200, 'Am-241':0.02, 'Pu-239':0.01, 'U-238':0.2, 'Ra-226':0.1 };

function activityAtUCi(w, asOfISO) {
  const a0 = w.activityUCi || 0;
  const t12 = HALF_LIFE_DAYS[w.isotope];
  if (!t12 || !w.collectedDate) return a0;
  const days = (Date.parse(asOfISO) - Date.parse(w.collectedDate)) / 86400000;
  if (!isFinite(days) || days <= 0) return a0;
  return a0 * Math.pow(0.5, days / t12);
}

function currentActivityUCi(w) { return activityAtUCi(w, todayISO()); }

function estActivityCell(w) {
  return (w.activityUCi || 0).toFixed(2) + ' µCi<br><span class="note">' + ((w.activityUCi || 0) * UCII_TO_MBQ).toFixed(4) + ' MBq</span>';
}

function currentActivityCell(w) {
  const a0 = w.activityUCi || 0;
  const t12 = HALF_LIFE_DAYS[w.isotope];
  if (!t12) return a0.toFixed(2) + ' µCi<br><span class="note">no decay data</span>';
  const cur = currentActivityUCi(w);
  const pct = a0 > 0 ? Math.round((1 - cur / a0) * 100) : 0;
  return cur.toFixed(2) + ' µCi<br><span class="note">' + (cur * UCII_TO_MBQ).toFixed(4) + ' MBq' + (pct >= 1 ? ' · −' + pct + '%' : '') + '</span>';
}

function activityAtDisposalCell(w) {
  const a0 = w.activityUCi || 0;
  const at = activityAtUCi(w, w.disposedDate);
  const pct = a0 > 0 ? Math.round((1 - at / a0) * 100) : 0;
  return at.toFixed(2) + ' µCi (' + (at * UCII_TO_MBQ).toFixed(4) + ' MBq)<br><span class="note">est. ' + a0.toFixed(2) + ' µCi at collection' + (pct >= 1 ? ' · −' + pct + '%' : '') + '</span>';
}

// Calculate %ALI (Annual Limit on Intake) for a waste container
function pctALI(w) {
  const cur = currentActivityUCi(w);
  const ali = ALI_UCI[w.isotope];
  if (!ali || ali <= 0) return null;
  return (cur / ali) * 100;
}

function pctALICell(w) {
  const pct = pctALI(w);
  if (pct === null) return '<span class="note">—</span>';
  const color = pct >= 10 ? 'var(--red)' : pct >= 1 ? 'var(--amb)' : 'var(--grn)';
  const cls = pct >= 10 ? 'b-expired' : pct >= 1 ? 'b-expiring' : 'b-safe';
  return '<span class="bdg ' + cls + '" style="font-weight:700">' + pct.toFixed(2) + '%</span>';
}

let uidCounter = 0;
function uid(prefix) { return (prefix || 'id') + '-' + Date.now().toString(36) + '-' + (++uidCounter) + '-' + Math.random().toString(36).slice(2, 7); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function currentPeriod() { const q = Math.floor(new Date().getMonth() / 3) + 1; return 'Q' + q + ' ' + new Date().getFullYear(); }
function currentMonth() { return todayISO().slice(0, 7); }
function daysUntil(dateStr) { if (!dateStr) return 0; const d = new Date(dateStr); const t = new Date(todayISO()); return Math.round((d - t) / 86400000); }
function fmtDate(d) { if (!d) return '—'; return d; }
function fmtDateLong(d) {
  if (!d) return '—';
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const parts = d.split('-').map(Number);
  const day = parts[2];
  const suffix = day === 1 || day === 21 || day === 31 ? 'st' : day === 2 || day === 22 ? 'nd' : day === 3 || day === 23 ? 'rd' : 'th';
  return day + '<sup>' + suffix + '</sup> ' + months[parts[1] - 1] + ', ' + parts[0];
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function computeLicenceState(source) {
  const exp = source.licenceExpiryDate;
  if (!exp) return { label:'No Expiry Set', color:'b-expired' };
  const days = daysUntil(exp);
  if (days < 0) return { label:'Expired (' + fmtDate(exp) + ')', color:'b-expired', days };
  const alertDays = LICENCE_ALERT_MONTHS * 30;
  if (days <= alertDays) return { label:'Renewal Due in ' + days + ' days', color:'b-expiring', days };
  return { label:'Valid until ' + fmtDate(exp), color:'b-valid', days };
}

const STAGE_LABEL = { 'possess': 'Possess', 'possess-use': 'Possess & Use', 'decommissioned': 'Decommissioned' };
const STAGE_BADGE = { 'possess': 'b-expiring', 'possess-use': 'b-safe', 'decommissioned': 'b-mute' };

function normIsoEntry(x) { return typeof x === 'string' ? { iso: x, description: '', limit: 0, chemicalForm: '', physicalForm: '', expUCi: 0, possUCi: 0 } : x; }
function isoEntries(g) { return (g.isotopes || []).map(normIsoEntry); }
function isoNamesOf(g) { return isoEntries(g).map(e => e.iso); }
function ruaExpiryState(u) {

}
function addYearISO(baseISO) { const d = baseISO ? new Date(baseISO) : new Date(); d.setFullYear(d.getFullYear() + 1); return d.toISOString().slice(0, 10); }
function nextRuaNo() {

// Audit trail — compare old vs new PI groups and describe every isotope-use / user change
function diffRuaGroups(oldGroups, newGroups) {
  const notes = [];
  const keyOf = g => g.piId || g.piName || '?';
  const oBy = {}, nBy = {};
  (oldGroups || []).forEach(g => oBy[keyOf(g)] = g);
  (newGroups || []).forEach(g => nBy[keyOf(g)] = g);
  Object.keys(nBy).forEach(k => { if (!oBy[k]) notes.push('Added PI group ' + (nBy[k].piName || k) + ' — isotopes: ' + (isoNamesOf(nBy[k]).join(', ') || 'none')); });
  Object.keys(oBy).forEach(k => { if (!nBy[k]) notes.push('Removed PI group ' + (oBy[k].piName || k)); });
  Object.keys(nBy).forEach(k => {
    const og = oBy[k]; if (!og) return;
    const ng = nBy[k], name = ng.piName || k;
    const oIso = {}, nIso = {};
    isoEntries(og).forEach(e => oIso[e.iso] = e);
    isoEntries(ng).forEach(e => nIso[e.iso] = e);
    Object.keys(nIso).forEach(iso => {
      if (!oIso[iso]) { notes.push(name + ': added isotope ' + iso + ((nIso[iso].limit) ? ' (limit ' + nIso[iso].limit + ' µCi)' : '')); return; }
      const o = oIso[iso], n = nIso[iso], ch = [];
      if ((o.limit || 0) !== (n.limit || 0)) ch.push('limit ' + (o.limit || 0) + ' → ' + (n.limit || 0) + ' µCi');
      if ((o.expUCi || 0) !== (n.expUCi || 0)) ch.push('experimental ' + (o.expUCi || 0) + ' → ' + (n.expUCi || 0) + ' µCi');
      if ((o.possUCi || 0) !== (n.possUCi || 0)) ch.push('possession ' + (o.possUCi || 0) + ' → ' + (n.possUCi || 0) + ' µCi');
      if ((o.physicalForm || '') !== (n.physicalForm || '')) ch.push('physical form ' + (o.physicalForm || '—') + ' → ' + (n.physicalForm || '—'));
      if ((o.chemicalForm || '') !== (n.chemicalForm || '')) ch.push('chemical form updated');
      if ((o.description || '') !== (n.description || '')) ch.push('experimental description updated');
      if (ch.length) notes.push(name + ' — ' + iso + ': ' + ch.join('; '));
    });
    Object.keys(oIso).forEach(iso => { if (!nIso[iso]) notes.push(name + ': removed isotope ' + iso); });
    const oU = {}, nU = {};
    (og.users || []).forEach(u => oU[u.name] = u.role);
    (ng.users || []).forEach(u => nU[u.name] = u.role);
    Object.keys(nU).forEach(nm => {
      if (!(nm in oU)) notes.push(name + ': added user ' + nm + ' (' + nU[nm] + ')');
      else if (oU[nm] !== nU[nm]) notes.push(name + ': user ' + nm + ' role ' + oU[nm] + ' → ' + nU[nm]);
    });
    Object.keys(oU).forEach(nm => { if (!(nm in nU)) notes.push(name + ': removed user ' + nm + ' (' + oU[nm] + ')'); });
  });
  return notes;
}

function swipeRuaState(spaceID) {
  const rua = S.ruas.find(u => u.spaceID === spaceID);
  if (!rua || !rua.nextSwipeTest) return { rua, due: false, label: '—' };
  const days = daysUntil(rua.nextSwipeTest);
  if (days <= 0) return { rua, due: true, label: fmtDate(rua.nextSwipeTest) + ' — OVERDUE' };
  return { rua, due: false, label: fmtDate(rua.nextSwipeTest) + ' (' + days + 'd)' };
}

// Parse a free-text activity string (e.g. '2.0 GBq', '37 MBq', '5 microCi') into microCi for summation
function parseActivityToUCi(str) {
  if (!str) return 0;
  const m = String(str).replace(/,/g, '').match(/([\d.]+)\s*(TBq|GBq|MBq|kBq|Bq|microCi|µCi|μCi|uCi|mCi|Ci)/i);
  if (!m) return 0;
  const v = parseFloat(m[1]), u = m[2].toLowerCase();
  if (u === 'tbq') return v * 1e12 / 37000;
  if (u === 'gbq') return v * 1e9 / 37000;
  if (u === 'mbq') return v * 1e6 / 37000;
  if (u === 'kbq') return v * 1e3 / 37000;
  if (u === 'bq') return v / 37000;
  if (u === 'mci') return v * 1000;
  if (u === 'ci') return v * 1e6;
  return v; // already microCi
}
function fmtUCi(x) {
  if (!x) return '0';
  if (x >= 1000) return Math.round(x).toLocaleString('en-US');
  if (x >= 1) return String(Math.round(x * 10) / 10);
  return String(Math.round(x * 1000) / 1000);
}

// Licence-renewal overview: unsealed activity per location (rows) × isotope (columns), with isotope totals
function unsealedSummaryData() {
  const us = S.sources.filter(s => s.category === 'unsealed');
  const isotopes = [...new Set(us.map(s => s.isotope || '—'))].sort();
  const locs = [...new Set(us.map(s => s.spaceID || s.location || '—'))].sort();
  const grid = {}, isoTotals = {}, locTotals = {};
  let grand = 0;
  us.forEach(s => {
    const loc = s.spaceID || s.location || '—', iso = s.isotope || '—', a = parseActivityToUCi(s.activity);
    grid[loc] = grid[loc] || {};
    grid[loc][iso] = (grid[loc][iso] || 0) + a;
    isoTotals[iso] = (isoTotals[iso] || 0) + a;
    locTotals[loc] = (locTotals[loc] || 0) + a;
    grand += a;
  });
  return { isotopes, locs, grid, isoTotals, locTotals, grand };
}

// Quarterly acquisitions & consumption report for unsealed sources (licence renewal / regulatory reporting)
function quarterlyData(qy, qq) {
  const qMonths = [0, 1, 2].map(i => String(qy) + '-' + String((qq - 1) * 3 + i + 1).padStart(2, '0'));
  const inQ = d => qMonths.some(m => (d || '').startsWith(m));
  const us = S.sources.filter(s => s.category === 'unsealed');
  const acquired = us.filter(s => inQ(s.acquiredDate)).sort((a, b) => (a.acquiredDate || '').localeCompare(b.acquiredDate || ''));
  const spent = [];
  us.forEach(s => (s.usageLog || []).forEach(u => { if (inQ(u.date)) spent.push(Object.assign({}, u, { isotope: s.isotope, sourceName: s.sourceName, location: s.spaceID || s.location })); }));
  spent.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const totA = acquired.reduce((a, s) => a + parseActivityToUCi(s.activity), 0);
  const totS = spent.reduce((a, u) => a + (u.activityUCi || 0), 0);
  return { acquired, spent, totA, totS };
}

// Parse activity string (e.g., '3.7 GBq', '37 MBq') to MBq
function parseActivityToMBq(str) {
  if (!str) return 0;
  const m = String(str).match(/([\d.]+)\s*(TBq|GBq|MBq|kBq|Bq)/i);
  if (!m) return 0;
  const v = parseFloat(m[1]), u = m[2].toUpperCase();
  if (u === 'TBQ') return v * 1e6;
  if (u === 'GBQ') return v * 1000;
  if (u === 'MBQ') return v;
  if (u === 'KBQ') return v / 1000;
  if (u === 'BQ') return v / 1e6;
  return 0;
}

// Calculate current activity for sealed source (decay-corrected from reference date)
function sealedCurrentActivityMBq(s) {
  const refMBq = parseActivityToMBq(s.activityReference);
  if (!refMBq || !s.referenceDate) return refMBq;
  const t12 = HALF_LIFE_DAYS[s.isotope];
  if (!t12) return refMBq;
  const days = (Date.parse(todayISO()) - Date.parse(s.referenceDate)) / 86400000;
  if (!isFinite(days) || days <= 0) return refMBq;
  return refMBq * Math.pow(0.5, days / t12);
}

function formatActivityMBq(mbq) {
  if (!mbq || mbq <= 0) return '—';
  if (mbq >= 1e6) return (mbq / 1e6).toFixed(2) + ' TBq';
  if (mbq >= 1000) return (mbq / 1000).toFixed(2) + ' GBq';
  if (mbq >= 1) return mbq.toFixed(2) + ' MBq';
  return (mbq * 1000).toFixed(2) + ' kBq';
}

function sealedCurrentActivityCell(s) {
  const cur = sealedCurrentActivityMBq(s);
  const ref = parseActivityToMBq(s.activityReference);
  if (!ref || !s.referenceDate) return '<span class="note">—</span>';
  const pct = ref > 0 ? Math.round((1 - cur / ref) * 100) : 0;
  return formatActivityMBq(cur) + '<br><span class="note">' + (pct >= 1 ? '−' + pct + '% from ref.' : '') + '</span>';
}

function downloadCSV(filename, rows) {
  const csv = rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 4200);
}

function deptOf(source) {
  if (source.department) return source.department;
  const loc = S.locations.find(l => l.spaceID === source.spaceID);
  return loc ? loc.department : 'Unassigned';
}

function filteredSources() {
  const q = S.invSearch.toLowerCase();
  let rows = S.sources.filter(s => {
    if (s.category !== S.cat) return false;
    if (S.invDept && deptOf(s) !== S.invDept) return false;
    if (S.invIso && s.isotope !== S.invIso) return false;
    if (S.invLicence && s.licenceNumber !== S.invLicence) return false;
    if (q) {
      const hay = ((s.sourceName || '') + ' ' + (s.equipmentDescription || '') + ' ' + (s.location || '') + ' ' + (s.custodian || '') + ' ' + (s.licenceNumber || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  if (S.invSortCol && S.cat === 'unsealed') {
    const dir = S.invSortDir === 'desc' ? -1 : 1;
    rows.sort((a, b) => {
      let va, vb;
      if (S.invSortCol === 'rua') {
        const ra = S.ruas.find(u => u.spaceID === (a.spaceID || a.location));
        const rb = S.ruas.find(u => u.spaceID === (b.spaceID || b.location));
        va = ra ? ra.ruaNo || ra.spaceID : 'zzz';
        vb = rb ? rb.ruaNo || rb.spaceID : 'zzz';
      } else if (S.invSortCol === 'source') { va = a.sourceName || ''; vb = b.sourceName || ''; }
      else if (S.invSortCol === 'isotope') { va = a.isotope || ''; vb = b.isotope || ''; }
      else if (S.invSortCol === 'location') { va = a.location || a.spaceID || ''; vb = b.location || b.spaceID || ''; }
      else if (S.invSortCol === 'custodian') { va = a.custodian || ''; vb = b.custodian || ''; }
      else { va = ''; vb = ''; }
      if (va < vb) return -1 * dir; if (va > vb) return 1 * dir; return 0;
    });
  }
  return rows;
}

      h += '<div class="card" style="margin-bottom:8px;padding:8px 10px">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" data-toggle="checkHistory">' +
        '<h3 style="margin:0;font-size:12px"><span class="acc">🕓</span> Check History <span class="note">(' + (s.checkHistory || []).length + ')</span></h3>' +
        '<span class="note" style="font-weight:600;font-size:11px">' + chev + (S.checkHistoryOpen ? ' hide' : ' show') + '</span></div>' +
        (S.checkHistoryOpen ? '<div class="hist" style="margin-top:6px">' +
        (s.checkHistory && s.checkHistory.length ? s.checkHistory.map(c => '<div class="hi" style="padding:3px 0">' + esc(c) + '</div>').join('') : '<div class="note">No checks recorded</div>') +
        '</div>' : '') +
        '</div>';
      h += '<div class="card" style="padding:8px 10px;border-color:' + (due ? 'rgba(239,68,68,.4)' : 'var(--brd)') + '">' +
        '<h3 style="margin:0 0 6px;font-size:12px">🧫 Annual Leak Test</h3>' +
        '<div class="kv" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px">' +
        '<div class="kv"><div class="k">Last</div><div class="v" style="font-size:12px">' + fmtDate(s.lastLeakTest) + '</div></div>' +
        '<div class="kv"><div class="k">Next Due</div><div class="v" style="font-size:12px">' + fmtDate(s.nextLeakTest) + (due ? ' <span class="bdg b-alert" style="padding:1px 4px;font-size:9px">OVERDUE</span>' : '') + '</div></div>' +
        '</div>' +
        ((s.leakTestResult || s.leakTestCounts != null) ? leakResultKv(s) : '') +
        '<div class="hist" style="margin-top:4px">' + ((s.leakTestHistory || []).length ? s.leakTestHistory.map(x => '<div class="hi" style="padding:3px 0">' + esc(typeof x === 'string' ? x : leakEntryText(x)) + '</div>').join('') : '<div class="note">No leak tests recorded yet</div>') + '</div>' +
        '</div>';
    } else {
      const rua = S.ruas.find(u => u.spaceID === (s.spaceID || s.location));
      const swDue = rua && rua.nextSwipeTest && daysUntil(rua.nextSwipeTest) <= 0;
      h += '<div class="card" style="padding:12px;border-color:' + (swDue ? 'rgba(239,68,68,.4)' : 'var(--brd)') + '"><h3 class="acc" style="margin-bottom:8px">🧫 Location Swipe Test — ' + esc(s.spaceID || s.location || '—') + '</h3>' +
        '<div class="note" style="margin-bottom:8px">Swipe surveys are scheduled per RUA location — one RUA per room where unsealed work is done, shared by every isotope stock here.</div>' +
        (rua ? '<div class="kv" style="display:grid;gap:8px">' +
        '<div class="kv"><div class="k">Last Swipe Test</div><div class="v">' + fmtDate(rua.lastSwipeTest) + '</div></div>' +
        '<div class="kv"><div class="k">Next Due</div><div class="v">' + fmtDate(rua.nextSwipeTest) + (swDue ? ' <span class="bdg b-alert" style="padding:1px 6px">OVERDUE</span>' : '') + '</div></div>' +
        '</div>' +
        '<div class="hist" style="margin-top:10px">' + ((rua.swipeHistory || []).length ? rua.swipeHistory.map((x, xi) => { var hasDal = typeof x !== 'string' && x.sites && x.sites.some(function(s) { return s.classification === 'above_dal'; }); return '<div class="hi" style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div style="flex:1">' + (typeof x === 'string' ? stripHtmlTags(x) : swipeEntryText(x)) + '</div><div style="display:flex;gap:4px;flex-shrink:0">' + (typeof x !== 'string' && x.sites ? '<button class="btn btn-o btn-s" style="white-space:nowrap;padding:3px 8px;font-size:10px" data-swprint="' + rua.id + ':' + xi + '">🖨 Report</button>' + (hasDal ? '<button class="btn btn-r btn-s" style="white-space:nowrap;padding:3px 8px;font-size:10px" data-adalprint="' + rua.id + ':' + xi + '">🚨 ADAL Report</button>' : '') : '') + '</div></div>'; }).join('') : '<div class="note">No swipe tests recorded for this room yet</div>') + '</div>' +
        '<button class="btn btn-p" style="width:100%;margin-top:10px" data-act="swipeTest">🧫 Conduct Swipe Test</button>' : '<div class="note" style="margin-top:8px">⚠ No RUA registered for this location — register one under Radiation Use Authorizations to schedule swipe tests.</div>') + '</div>';
      const spent = (s.usageLog || []).reduce((a, u) => a + (u.activityUCi || 0), 0);
      const remaining = parseActivityToUCi(s.activity) - spent;
      h += '<div class="card" style="padding:12px;margin-top:12px"><h3 class="acc" style="margin-bottom:8px">📦 Acquisition</h3>' +
        '<div class="kv" style="display:grid;gap:8px">' +
        '<div class="kv"><div class="k">Acquired Date</div><div class="v">' + fmtDate(s.acquiredDate) + '</div></div>' +
        '<div class="kv"><div class="k">Purchased By</div><div class="v">' + esc(s.purchasedBy || '—') + '</div></div>' +
        '<div class="kv"><div class="k">Vendor</div><div class="v">' + esc(s.vendorName || '—') + '</div></div>' +
        '<div class="kv"><div class="k">Volume</div><div class="v">' + esc(s.volume || '—') + '</div></div>' +
        '</div></div>';
      h += '<div class="card" style="padding:12px;margin-top:12px"><h3 class="acc" style="margin-bottom:8px">🧪 Usage Log (Spent)</h3>' +
        '<div class="hist">' + ((s.usageLog || []).length ? s.usageLog.map(u => '<div class="hi"><div><b class="mono">' + fmtDate(u.date) + '</b> — ' + esc(u.volume || '') + ', <span class="mono">' + fmtUCi(u.activityUCi || 0) + ' µCi</span><br><span class="note">by ' + esc(u.by || '—') + (u.notes ? ' — ' + esc(u.notes) : '') + '</span></div></div>').join('') : '<div class="note">No consumption recorded yet</div>') + '</div>' +
        (spent ? '<div class="note" style="margin-top:8px">Spent to date: <b>' + fmtUCi(spent) + ' µCi</b>' + (remaining > 0 ? ' · Nominal remaining: <b>' + fmtUCi(remaining) + ' µCi</b>' : '') + '</div>' : '') +
        '<button class="btn btn-o" style="width:100%;margin-top:10px" data-act="usageLog">➕ Record Consumption</button></div>';
    }
  }
  h += '</div>';
  return h;
}

// ════════════════════════════════════════════════════════════════

async function performLeakTest(id) {
  const s = S.sources.find(x => x.id === id);
  if (!s) return;
  const html = '<div class="mback" id="mback"><div class="modal">' +
    '<div class="mh"><h3><span class="acc">🧫</span> Conduct Leak Test — ' + esc(s.sourceName || s.equipmentDescription) + '</h3><button class="x" data-close>✕</button></div>' +
    '<div class="note" style="margin-bottom:12px">Record the wipe/swipe count measured for this sealed source. The net count (measured − background) is the leak indicator and is stored with the result.</div>' +
    '<div style="display:grid;gap:12px">' +
    '<div class="fg"><div class="fi"><label>Test Date *</label><input id="ltDate" type="date" value="' + todayISO() + '"></div>' +
    '<div class="fi"><label>Result *</label><select id="ltResult"><option value="pass" selected>Pass</option><option value="fail">Fail</option></select></div></div>' +
    '<div class="fg"><div class="fi"><label>Measured Count (cpm) *</label><input id="ltCounts" type="number" min="0" step="any" placeholder="e.g., 32"></div>' +
    '<div class="fi"><label>Background Count (cpm)</label><input id="ltBg" type="number" min="0" step="any" placeholder="e.g., 25"></div></div>' +
    '<div class="fi"><label>Net Count (cpm)</label><input id="ltNet" readonly tabindex="-1" style="background:var(--bg)"><div class="hint">Measured − background, computed automatically</div></div>' +
    '<div class="fi"><label>Notes / Follow-up Action (required if Fail)</label><input id="ltNotes" placeholder="Action taken if positive, e.g., source quarantined"></div>' +
    '<div class="fi f" id="ltErrWrap" style="display:none"><div style="background:var(--red-l);color:var(--red);border-radius:6px;padding:8px 12px;font-size:11px" id="ltErr"></div></div>' +
    '</div>' +
    '<div class="mbtns"><button class="btn btn-o" data-close>Cancel</button><button class="btn btn-p" id="ltSubmit">Record Leak Test</button></div>' +
    '</div></div>';
  document.getElementById('modalHost').innerHTML = html;

  const countsEl = document.getElementById('ltCounts');
  const bgEl = document.getElementById('ltBg');
  const netEl = document.getElementById('ltNet');
  const recalc = () => {
    const m = parseFloat(countsEl.value);
    const b = parseFloat(bgEl.value) || 0;
    netEl.value = isNaN(m) ? '' : (m - b).toFixed(1);
  };
  countsEl.addEventListener('input', recalc);
  bgEl.addEventListener('input', recalc);

  document.getElementById('ltSubmit').onclick = async () => {
    const date = document.getElementById('ltDate').value;
    const result = document.getElementById('ltResult').value;
    const counts = parseFloat(countsEl.value);
    const bg = parseFloat(bgEl.value) || 0;
    const notes = document.getElementById('ltNotes').value.trim();
    if (!date || isNaN(counts) || counts < 0) {
      document.getElementById('ltErr').textContent = 'Test date and a non-negative measured count (cpm) are required.';
      document.getElementById('ltErrWrap').style.display = 'block';
      return;
    }
    if (result === 'fail' && !notes) {
      document.getElementById('ltErr').textContent = 'A follow-up action is required when a leak test is positive (fail).';
      document.getElementById('ltErrWrap').style.display = 'block';
      return;
    }
    const net = counts - bg;
    const parts = date.split('-').map(Number);
    const next = new Date(parts[0], parts[1] - 1, parts[2] + LEAK_INTERVAL_DAYS);
    s.lastLeakTest = date;
    s.nextLeakTest = next.getFullYear() + '-' + String(next.getMonth() + 1).padStart(2, '0') + '-' + String(next.getDate()).padStart(2, '0');
    s.leakTestCounts = counts;
    s.leakTestBackground = bg || undefined;
    s.leakTestResult = result;
    s.leakTestNotes = notes || undefined;
    s.status = result === 'fail' ? 'alert' : 'safe';
    s.leakTestHistory = s.leakTestHistory || [];
    s.leakTestHistory.unshift({ id: uid('lt'), date, counts, background: bg, net, result, notes: notes || undefined });
    await persistSource(s);
    closeModal();
    toast((result === 'fail' ? '🚨 Leak test FAILED for ' : '🧫 Leak test recorded for ') + (s.sourceName || s.equipmentDescription) + ' — net ' + net.toFixed(1) + ' cpm — next due ' + s.nextLeakTest);
    renderAll();
  };
}

function leakResultKv(s) {
  const resBadge = s.leakTestResult === 'fail' ? '<span class="bdg b-alert">FAIL</span>'
    : (s.leakTestResult === 'pass' ? '<span class="bdg b-safe">PASS</span>' : '<span class="note">—</span>');
  let kv = '';
  if (s.leakTestCounts != null) {
    const net = s.leakTestCounts - (s.leakTestBackground || 0);
    kv += '<div class="kv"><div class="k">Measured Count</div><div class="v mono">' + s.leakTestCounts + ' cpm' + (s.leakTestBackground != null ? ' <span class="note">(bg ' + s.leakTestBackground + ')</span>' : '') + '</div></div>';
    kv += '<div class="kv"><div class="k">Net Count</div><div class="v mono">' + net.toFixed(1) + ' cpm</div></div>';
  }
  kv += '<div class="kv"><div class="k">Result</div><div class="v">' + resBadge + (s.leakTestNotes ? ' <span class="note">' + esc(s.leakTestNotes) + '</span>' : '') + '</div></div>';
  return kv;
}

async function conductSwipeTest(rua) { openSwipeForm(rua); }

function openSwipeForm(rua) {
  if (!rua) return;
  const COUNT_TIME = 5; // minutes
  const dept = rua.department || '';
  const room = rua.spaceID || '';
  const yy = todayISO().slice(2, 4);
  const mmdd = todayISO().slice(5, 10).replace('-', '');
  const autoSN = 'SW_' + dept.replace(/[^A-Z0-9]/gi, '').toUpperCase().slice(0, 6) + '_' + room.replace(/[^A-Z0-9]/gi, '').toUpperCase().slice(0, 6) + '_' + yy + mmdd;
  const html = '<div class="mback" id="mback"><div class="modal" style="max-width:600px">' +
    '<div class="mh"><h3><span class="acc">🧫</span> Conduct Swipe Test — ' + esc(rua.spaceID) + '</h3><button class="x" data-close>✕</button></div>' +
    '<div class="note" style="margin-bottom:12px">Enter background and detector efficiency to auto-calculate MDA and action levels. Add one or more swipe sites — each reading is classified automatically.</div>' +
    '<div style="display:grid;gap:12px">' +
    '<div style="font-weight:700;font-size:11px;color:var(--amb);text-transform:uppercase;letter-spacing:.5px">Part A: Sampling</div>' +
    '<div class="fg"><div class="fi"><label>Test Date *</label><input id="swDate" type="date" value="' + todayISO() + '"></div>' +
    '<div class="fi"><label>Department</label><input id="swDept" value="' + esc(dept) + '" placeholder="Department"></div></div>' +
    '<div class="fg"><div class="fi"><label>Sampling S/N</label><input id="swSN" value="' + esc(autoSN) + '" style="font-family:var(--mono);font-size:11px"></div>' +
    '<div class="fi"><label>Sampled by</label><input id="swSampledBy" placeholder="Name"></div></div>' +
    '<div style="font-weight:700;font-size:11px;color:var(--amb);text-transform:uppercase;letter-spacing:.5px;margin-top:4px">Part B: Analysis</div>' +
    '<div class="fg"><div class="fi"><label>Date of Analysis</label><input id="swAnalysisDate" type="date" value="' + todayISO() + '"></div>' +
    '<div class="fi"><label>Calibration Date</label><input id="swCalDate" type="date"></div></div>' +
    '<div class="fi"><label>Analyzed by</label><input id="swAnalyzedBy" placeholder="Name"></div>' +
    '<div class="fg"><div class="fi"><label>Background B1 (dpm) *</label><input id="swBg" type="number" min="0" step="any" placeholder="e.g., 74"></div>' +
    '<div class="fi"><label>Detector Efficiency E (decimal) *</label><input id="swEff" type="number" min="0.001" max="1" step="any" placeholder="e.g., 0.35"></div></div>' +
    '<div id="swThresh" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;background:var(--bg);border-radius:6px;font-size:11px"></div>' +
    '<div style="font-weight:700;font-size:11px;color:var(--amb);text-transform:uppercase;letter-spacing:.5px;margin-top:4px">Swipe Sites</div>' +
    '<div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><button class="btn btn-o btn-s" id="swAddSite" type="button">+ Add Site</button></div>' +
    '<div class="tw"><table style="font-size:12px"><thead><tr><th style="width:8%">No.</th><th style="width:32%">Site Location</th><th style="width:20%">Measured (dpm)</th><th style="width:18%">Result</th><th style="width:22%">Action</th></tr></thead><tbody id="swSitesBody"></tbody></table></div></div>' +
    '<div class="fi"><label>Follow-up / Comments</label><input id="swFollow" placeholder="e.g., area decontaminated and re-surveyed"></div>' +
    '<div class="fi f" id="swErrWrap" style="display:none"><div style="background:var(--red-l);color:var(--red);border-radius:6px;padding:8px 12px;font-size:11px" id="swErr"></div></div>' +
    '</div>' +
    '<div class="mbtns"><button class="btn btn-o" data-close>Cancel</button><button class="btn btn-p" id="swSubmit">Record Swipe Test</button></div>' +
    '</div></div>';
  document.getElementById('modalHost').innerHTML = html;

  const bgEl = document.getElementById('swBg');
  const effEl = document.getElementById('swEff');
  const threshEl = document.getElementById('swThresh');
  const tbody = document.getElementById('swSitesBody');
  let sites = [{ id: uid('st'), location: '', dpm: '' }];

  const classify = (dpm, mda, pos, adal, dal) => {
    if (dpm >= dal) return { label: 'ABOVE DAL', color: 'var(--red)', bg: 'var(--red-l)' };
    if (dpm >= adal) return { label: 'ABOVE ADAL', color: 'var(--amb)', bg: 'var(--amb-l)' };
    if (dpm >= pos) return { label: 'Positive', color: 'var(--amb)', bg: 'var(--amb-l)' };
    return { label: 'Clean', color: 'var(--grn)', bg: 'var(--grn-l)' };
  };

  const updateBadges = (mda, pos, adal, dal) => {
    tbody.querySelectorAll('tr').forEach((tr, i) => {
      if (i >= sites.length) return;
      const s = sites[i];
      const dpm = parseFloat(s.dpm);
      const resultCell = tr.children[3];
      if (!resultCell) return;
      if (!isNaN(dpm) && !isNaN(mda)) {
        const c = classify(dpm, mda, pos, adal, dal);
        resultCell.innerHTML = '<span class="bdg" style="background:' + c.bg + ';color:' + c.color + ';padding:2px 6px;font-size:10px">' + c.label + '</span>';
      } else {
        resultCell.innerHTML = '<span class="note">—</span>';
      }
    });
  };

  const recalc = () => {
    const b = parseFloat(bgEl.value);
    const e = parseFloat(effEl.value);
    if (!isNaN(b) && b >= 0 && !isNaN(e) && e > 0) {
      const mda = (2.71 + 4.65 * Math.sqrt(b)) / (COUNT_TIME * e);
      const pos = b + mda;
      const adal = b + 200;
      const dal = b + 1000;
      threshEl.innerHTML = '<div><span class="note">MDA:</span> <b class="mono">' + mda.toFixed(2) + ' dpm</b></div>' +
        '<div><span class="note">Positive:</span> <b class="mono">' + pos.toFixed(2) + ' dpm</b></div>' +
        '<div><span class="note">ADAL:</span> <b class="mono">' + adal.toFixed(0) + ' dpm</b></div>' +
        '<div><span class="note">DAL:</span> <b class="mono">' + dal.toFixed(0) + ' dpm</b></div>';
      updateBadges(mda, pos, adal, dal);
    } else {
      threshEl.innerHTML = '<div class="note" style="grid-column:1/-1;text-align:center">Enter background and efficiency to see thresholds</div>';
      updateBadges(NaN, NaN, NaN, NaN);
    }
  };

  const renderSites = () => {
    const b = parseFloat(bgEl.value);
    const e = parseFloat(effEl.value);
    let mda, pos, adal, dal;
    if (!isNaN(b) && b >= 0 && !isNaN(e) && e > 0) {
      mda = (2.71 + 4.65 * Math.sqrt(b)) / (COUNT_TIME * e);
      pos = b + mda; adal = b + 200; dal = b + 1000;
    }
    tbody.innerHTML = sites.map((s, i) => {
      const dpm = parseFloat(s.dpm);
      let resultHtml = '<span class="note">—</span>';
      if (!isNaN(dpm) && !isNaN(mda)) {
        const c = classify(dpm, mda, pos, adal, dal);
        resultHtml = '<span class="bdg" style="background:' + c.bg + ';color:' + c.color + ';padding:2px 6px;font-size:10px">' + c.label + '</span>';
      }
      return '<tr><td class="mono" style="text-align:center;font-size:11px">' + (i + 1) + '</td>' +
        '<td><input style="width:100%;font-size:11px" data-sloc="' + i + '" value="' + esc(s.location) + '" placeholder="e.g., Workbench"></td>' +
        '<td><input style="width:100%;font-size:11px" type="number" min="0" step="any" data-sdpm="' + i + '" value="' + (s.dpm !== '' ? s.dpm : '') + '" placeholder="dpm"></td>' +
        '<td>' + resultHtml + '</td>' +
        '<td><button class="btn btn-r btn-s" style="padding:2px 6px;font-size:10px" data-srm="' + i + '">✕</button></td></tr>';
    }).join('') || '<tr><td colspan="5" class="note" style="text-align:center;padding:12px">No sites added yet — click "+ Add Site"</td></tr>';
  };

  bgEl.addEventListener('input', recalc);
  effEl.addEventListener('input', recalc);
  document.getElementById('swAddSite').onclick = () => { sites.push({ id: uid('st'), location: '', dpm: '' }); renderSites(); recalc(); };
  tbody.addEventListener('click', e => {
    const rm = e.target.closest('[data-srm]');
    if (rm !== null) { sites.splice(parseInt(rm.dataset.srm), 1); renderSites(); recalc(); }
  });
  tbody.addEventListener('input', e => {
    if (e.target.dataset.sloc !== undefined) { sites[parseInt(e.target.dataset.sloc)].location = e.target.value; }
    if (e.target.dataset.sdpm !== undefined) { sites[parseInt(e.target.dataset.sdpm)].dpm = e.target.value; recalc(); }
  });

  renderSites();
  recalc();

  document.getElementById('swSubmit').onclick = async () => {
    const date = document.getElementById('swDate').value;
    const dept = document.getElementById('swDept').value.trim();
    const sn = document.getElementById('swSN').value.trim();
    const sampledBy = document.getElementById('swSampledBy').value.trim();
    const analysisDate = document.getElementById('swAnalysisDate').value;
    const calDate = document.getElementById('swCalDate').value;
    const analyzedBy = document.getElementById('swAnalyzedBy').value.trim();
    const bg = parseFloat(bgEl.value);
    const eff = parseFloat(effEl.value);
    const follow = document.getElementById('swFollow').value.trim();
    const showErr = msg => { document.getElementById('swErr').textContent = msg; document.getElementById('swErrWrap').style.display = 'block'; };
    if (!date) return showErr('Test date is required.');
    if (isNaN(bg) || bg < 0) return showErr('A non-negative background (dpm) is required.');
    if (isNaN(eff) || eff <= 0 || eff > 1) return showErr('Efficiency must be between 0 and 1 (e.g., 0.35 for 35%).');
    const validSites = sites.filter(s => s.location.trim() && s.dpm !== '' && !isNaN(parseFloat(s.dpm)));
    if (!validSites.length) return showErr('At least one site with a location name and measured value is required.');
    const mda = (2.71 + 4.65 * Math.sqrt(bg)) / (COUNT_TIME * eff);
    const pos = bg + mda;
    const adal = bg + 200;
    const dal = bg + 1000;
    const siteResults = validSites.map((s, idx) => {
      const dpm = parseFloat(s.dpm);
      const c = classify(dpm, mda, pos, adal, dal);
      return { id: s.id, sampleNo: idx + 1, location: s.location.trim(), dpm, result: c.label, classification: c.label.toLowerCase().replace(/\s+/g, '_') };
    });
    const worst = siteResults.some(s => s.classification.includes('dal')) ? 'adal' :
      siteResults.some(s => s.classification.includes('adal')) ? 'adal' :
      siteResults.some(s => s.classification === 'positive') ? 'positive' : 'clean';
    const parts = date.split('-').map(Number);
    const next = new Date(parts[0], parts[1] - 1, parts[2] + SWIPE_INTERVAL_DAYS);
    rua.lastSwipeTest = date;
    rua.nextSwipeTest = next.getFullYear() + '-' + String(next.getMonth() + 1).padStart(2, '0') + '-' + String(next.getDate()).padStart(2, '0');
    rua.swipeHistory = rua.swipeHistory || [];
    rua.swipeHistory.unshift({
      id: uid('sw'), date, department: dept, samplingSN: sn, sampledBy,
      analysisDate, calibrationDate: calDate, analyzedBy,
      background: bg, efficiency: eff, countTime: COUNT_TIME,
      mda: parseFloat(mda.toFixed(2)), positive: parseFloat(pos.toFixed(2)),
      adal: parseFloat(adal.toFixed(0)), dal: parseFloat(dal.toFixed(0)),
      sites: siteResults, overallResult: worst, followUp: follow || undefined
    });
    await persistRua(rua);
    closeModal();
    const flag = worst === 'clean' ? '🧫 Swipe test recorded for ' : '🚨 Swipe test flagged for ';
    const siteCount = siteResults.length;

function fmtDateOrdinal(d) {
  if (!d) return '—';
  var dt = new Date(d);
  var day = dt.getDate();
  var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var suffix = day === 1 || day === 21 || day === 31 ? 'st' : day === 2 || day === 22 ? 'nd' : day === 3 || day === 23 ? 'rd' : 'th';
  return day + suffix + ' ' + months[dt.getMonth()] + ', ' + dt.getFullYear();
}

function importCSV() {
  const fileInput = document.getElementById('csvImportFile');
  if (!fileInput) {
    toast('⚠ File input not found. Please refresh the page.', 'error');
    return;
  }
  fileInput.click();
  fileInput.onchange = async (e) => {
    try {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      const lines = text.split('\n').map(l => l.trim()).filter(l => l);
      if (lines.length < 2) { toast('⚠ CSV file is empty or has no data rows', 'error'); return; }
      
      const headers = parseCSVLine(lines[0]);
      const dataRows = lines.slice(1).map(l => parseCSVLine(l));
      
      let added = 0, updated = 0;
      let errors = [];
      
      if (S.cat === 'apparatus') {
        // Apparatus import
        const headerMap = {
          equipment: 'equipmentDescription',
          stage: 'stage',
          location: 'location',
          spaceid: 'spaceID',
          department: 'department',
          custodian: 'custodian',
          licence: 'licenceNumber',
          'licence expiry': 'licenceExpiryDate',
          'licence status': 'licenceStatus',
          'last check': 'lastInventoryCheckDate'
        };
        
        dataRows.forEach((row, idx) => {
          try {
            const obj = {};
            headers.forEach((h, i) => {
              const key = headerMap[h.toLowerCase().trim()];
              if (key) obj[key] = row[i] || '';
            });
            
            if (!obj.equipmentDescription || !obj.location) {
              errors.push('Row ' + (idx + 2) + ': Missing required fields (Equipment or Location)');
              return;
            }
            
            // Check if exists by equipmentDescription + location
            const existing = S.sources.find(s => s.category === 'apparatus' && s.equipmentDescription === obj.equipmentDescription && s.location === obj.location);
            if (existing) {
              Object.assign(existing, obj);
              updated++;
            } else {
              S.sources.push({
                id: uid('rad'),
                category: 'apparatus',
                equipmentDescription: obj.equipmentDescription,
                location: obj.location,
                spaceID: obj.spaceID || obj.location,
                department: obj.department || '',
                custodian: obj.custodian || '',
                licenceNumber: obj.licenceNumber || '',
                licenceExpiryDate: obj.licenceExpiryDate || '',
                lastInventoryCheckDate: obj.lastInventoryCheckDate || '',
                stage: obj.stage || 'possess-use',
                addedDate: todayISO(),
                checkHistory: [],
                licenceHistory: []
              });
              added++;
            }
          } catch (err) {
            errors.push('Row ' + (idx + 2) + ': ' + err.message);
          }
        });
      } else {
        // Sealed/Unsealed source import
        const headerMap = {
          source: 'sourceName',
          category: 'category',
          isotope: 'isotope',
          activity: 'activity',
          location: 'location',
          spaceid: 'spaceID',
          department: 'department',
          custodian: 'custodian',
          status: 'status',
          'last leak test': 'lastLeakTest',
          'next leak test': 'nextLeakTest',
          'last check': 'lastInventoryCheckDate'
        };
        
        dataRows.forEach((row, idx) => {
          try {
            const obj = {};
            headers.forEach((h, i) => {
              const key = headerMap[h.toLowerCase().trim()];
              if (key) obj[key] = row[i] || '';
            });
            
            if (!obj.sourceName || !obj.activity || !obj.location) {
              errors.push('Row ' + (idx + 2) + ': Missing required fields (Source, Activity, or Location)');
              return;
            }
            
            // Check if exists by sourceName + location
            const existing = S.sources.find(s => s.category === S.cat && s.sourceName === obj.sourceName && s.location === obj.location);
            if (existing) {
              Object.assign(existing, obj);
              updated++;
            } else {
              S.sources.push({
                id: uid('rad'),
                category: S.cat,
                sourceName: obj.sourceName,
                isotope: obj.isotope || '',
                activity: obj.activity,
                location: obj.location,
                spaceID: obj.spaceID || obj.location,
                department: obj.department || '',
                custodian: obj.custodian || '',
                status: obj.status || 'safe',
                lastLeakTest: obj.lastLeakTest || '',
                nextLeakTest: obj.nextLeakTest || '',
                lastInventoryCheckDate: obj.lastInventoryCheckDate || '',
                addedDate: todayISO(),
                checkHistory: []
              });
              added++;
            }
          } catch (err) {
            errors.push('Row ' + (idx + 2) + ': ' + err.message);
          }
        });
      }
      
      lsSave(LS_KEYS.sources, S.sources);
      renderAll();
      
      if (errors.length > 0) {
        toast('⚠ Import completed with ' + errors.length + ' error(s). ' + added + ' added, ' + updated + ' updated.', 'error');
        console.warn('CSV Import errors:', errors);
      } else {
        toast('⬆ CSV imported: ' + added + ' added, ' + updated + ' updated', 'success');
      }
      fileInput.value = '';
    } catch (err) {
      console.error('CSV import error:', err);
      toast('⚠ CSV import failed: ' + err.message, 'error');
    }
  };
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQuotes && line[i + 1] === '"') {
        current += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (c === ',' && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += c;
    }
  }
  result.push(current);
  return result;
}

function incrementSourceNo(base, offset) {
  if (!base) return base;
  if (offset === 0) return base;
  // Try to find trailing number pattern (e.g., CS-001 -> CS-002)
  const m = base.match(/^(.*?)(\d+)$/);
  if (m) {
    const prefix = m[1];
    const num = parseInt(m[2]);
    const pad = m[2].length;
    return prefix + String(num + offset).padStart(pad, '0');
  }
  // No trailing number — append -N
  return base + '-' + (offset + 1);
}

        usageLog: []

      if (category === 'sealed') {
        const today = todayISO();
        const next = new Date(); next.setDate(next.getDate() + LEAK_INTERVAL_DAYS);
        source.lastLeakTest = today; source.nextLeakTest = next.toISOString().slice(0, 10);

    if (!editing && category === 'sealed' && source.quantity > 1) {

function openLicenceRenewal() {
  const oldLic = S.invLicence;
  if (!oldLic) return;
  const affected = S.sources.filter(s => s.category === S.cat && s.licenceNumber === oldLic);
  if (affected.length === 0) { toast('⚠ No sources found with this licence', 'error'); return; }
  
  const html = '<div class="mback" id="mback"><div class="modal">' +
    '<div class="mh"><h3><span class="acc">🔄</span> Renew Licence — Bulk Update</h3><button class="x" data-close>✕</button></div>' +
    '<div class="note" style="margin-bottom:12px">Update the licence number for <b>' + affected.length + ' ' + (S.cat === 'sealed' ? 'sealed' : 'unsealed') + ' sources</b> currently holding licence <span class="mono" style="color:var(--txt)">' + esc(oldLic) + '</span>.</div>' +
    '<div style="display:grid;gap:12px">' +
    '<div class="fi"><label>New Licence Number *</label><input id="lrNum" placeholder="e.g., SS-2027-XXXX"></div>' +
    '<div class="fi"><label>Notes</label><textarea id="lrNotes" rows="2" placeholder="Reason for renewal, e.g., Annual licence renewal 2027"></textarea></div>' +
    '<div class="fi f" id="lrErrWrap" style="display:none"><div style="background:var(--red-l);color:var(--red);border-radius:6px;padding:8px 12px;font-size:11px" id="lrErr"></div></div>' +
    '</div>' +
    '<div class="mbtns"><button class="btn btn-o" data-close>Cancel</button><button class="btn btn-p" id="lrSubmit">Update All ' + affected.length + ' Sources</button></div>' +
    '</div></div>';
  document.getElementById('modalHost').innerHTML = html;
  document.getElementById('lrSubmit').onclick = async () => {
    const num = document.getElementById('lrNum').value.trim();
    if (!num) { document.getElementById('lrErr').textContent = 'New licence number is required.'; document.getElementById('lrErrWrap').style.display = 'block'; return; }
    const notes = document.getElementById('lrNotes').value.trim();
    
    // Update all affected sources
    let updated = 0;
    for (const s of affected) {
      const oldNum = s.licenceNumber;
      s.licenceNumber = num;
      // Record in licence history
      s.licenceHistory = s.licenceHistory || [];
      s.licenceHistory.unshift({
        id: uid('lh'),
        licenceNumber: num,
        changedDate: todayISO(),
        changedBy: 'Marcus Chen',
        notes: 'Bulk renewal from ' + oldNum + (notes ? ': ' + notes : '')
      });
      await persistSource(s);
      updated++;
    }
    
    // Clear the licence filter and refresh
    S.invLicence = '';
    closeModal();
    renderAll();
    toast('🔄 Licence renewed for ' + updated + ' sources — now ' + num, 'success');
  };
}

    '<div class="note" style="margin-bottom:12px">Equipment installed — the possess licence (' + esc(s.licenceNumber || '—') + ') is archived and replaced by the possess &amp; use licence. The annual renewal cycle and annual checks begin.</div>' +
    '<div style="display:grid;gap:12px">' +
    '<div class="fg"><div class="fi"><label>Possess &amp; Use Licence Number *</label><input id="puNum" placeholder="XA-2026-XXXX"></div>' +

    '<div class="fi f"><label>X-ray Tube Serial Number(s)</label><input id="puSerials" value="' + esc(s.xrayTubeSerialNumbers || '') + '"><div class="hint">Now known after installation — comma-separated if multiple tubes.</div></div>' +
    '<div class="fi f" id="puErrWrap" style="display:none"><div style="background:var(--red-l);color:var(--red);border-radius:6px;padding:8px 12px;font-size:11px" id="puErr"></div></div>' +
    '</div>' +
    '<div class="mbtns"><button class="btn btn-o" data-close>Cancel</button><button class="btn btn-p" id="puSubmit">Save Change</button></div>' +
    '</div></div>';
  document.getElementById('modalHost').innerHTML = html;
  document.getElementById('puSubmit').onclick = async () => {
    const num = document.getElementById('puNum').value.trim();
    const expiry = document.getElementById('puExpiry').value;
    if (!num || !expiry) { document.getElementById('puErr').textContent = 'Licence number and expiry date are required.'; document.getElementById('puErrWrap').style.display = 'block'; return; }
    const f = document.getElementById('puFile');
    const fname = f.files.length ? f.files[0].name : '';
    if (fname && !fname.toLowerCase().endsWith('.pdf')) { document.getElementById('puErr').textContent = 'Licence document must be a PDF file.'; document.getElementById('puErrWrap').style.display = 'block'; return; }
    s.possessLicence = { number: s.licenceNumber, expiryDate: s.licenceExpiryDate, file: s.licenceFile };
    s.licenceNumber = num; s.licenceExpiryDate = expiry; if (fname) s.licenceFile = fname;
    const serials = document.getElementById('puSerials').value.trim();
    if (serials) s.xrayTubeSerialNumbers = serials;
    s.stage = 'possess-use';
    const notify = new Date(expiry); notify.setMonth(notify.getMonth() - LICENCE_ALERT_MONTHS);
    s.notificationDate = notify.toISOString().slice(0, 10);
    s.licenceHistory = s.licenceHistory || [];
    s.licenceHistory.unshift({ id: uid('lh'), licenceNumber: num, changedDate: todayISO(), changedBy: 'Marcus Chen', fileName: fname || undefined, notes: 'Changed from possess to possess & use licence after installation' });
    await persistSource(s);
    toast('⚙ ' + (s.equipmentDescription || 'Apparatus') + ' now holds a Possess & Use licence');
    closeModal();
    renderAll();
  };
}

// ════════════════════════════════════════════════════════════════
function renderRua() {
  if (S.ruaEditId) { renderRuaEdit(); return; }
  const q = S.ruaSearch.toLowerCase();
  const rows = S.ruas.filter(u => {
    if (S.ruaDept && u.department !== S.ruaDept) return false;
    if (S.ruaShowInactive !== true && u.status === 'inactive') return false;
    return !q || (u.spaceID + ' ' + u.department + ' ' + (u.personInCharge || '') + ' ' + (u.ruaNo || '')).toLowerCase().includes(q);
  });
  const ruaDepts = [...new Set(S.ruas.map(u => u.department))].filter(Boolean).sort();

  let html = '<div class="tb"><input class="sb" id="ruaSearch" placeholder="Search Space ID, department, person in charge…" value="' + esc(S.ruaSearch) + '">' +
    '<select class="sb" id="ruaDept"><option value="">All Departments</option>' + ruaDepts.map(d => '<option ' + (S.ruaDept === d ? 'selected' : '') + '>' + esc(d) + '</option>').join('') + '</select>' +
    '<button class="btn btn-p" id="ruaAdd">+ New Authorization</button></div>';

  if (rows.length === 0) {
    html += '<div class="empty"><div class="big">📋</div>No Radiation Use Authorizations yet.</div>';
  } else {
    html += '<div class="ruagrid">' + rows.map(u => {
      const totalUsers = (u.groups || []).reduce((a, g) => a + (g.users ? g.users.length : 0), 0);
      const iso = [...new Set((u.groups || []).flatMap(g => isoNamesOf(g)))];
      const ex = ruaExpiryState(u);
      return '<div class="ruacard ' + (S.ruaDetailId === u.id ? 'hl' : '') + '" data-rua="' + u.id + '">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">' +
        '<div><div class="mono" style="font-size:10px;font-weight:700;color:var(--amb);letter-spacing:.04em">' + esc(u.ruaNo || '—') + '</div><div class="mono" style="font-weight:700;font-size:14px;color:var(--txt)">' + esc(u.spaceID) + '</div><div class="note">' + esc(u.department) + '</div></div>' +
        '<span class="bdg ' + (u.type === 'Communal' ? 'b-communal' : 'b-individual') + '">' + u.type + '</span></div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">' + iso.map(i => '<span class="bdg b-safe" style="text-transform:none">' + i + '</span>').join('') + '</div>' +
        '<div class="note">👥 ' + (u.groups || []).length + ' group(s) · ' + totalUsers + ' authorized user(s)</div>' +
        '<div style="margin-top:6px"><span class="bdg ' + ex.color + '">' + ex.label + '</span></div>' +
        '</div>';
    }).join('') + '</div>';
  }
  html += '<div style="display:flex;align-items:center;gap:10px;margin-top:10px"><div class="note">Click a card to view the full authorization — PI groups, isotope use details, safety controls and expiry; use ✏ Edit to open the full-width editor. RUAs are renewed annually; items within one month of expiry are flagged.</div>' +
    '<label style="font-size:11px;white-space:nowrap;margin-left:auto"><input type="checkbox" id="ruaShowInactive"' + (S.ruaShowInactive ? ' checked' : '') + '> Show Inactive</label></div>';

  const detailHtml = renderRuaDetail();
  if (S.ruaDetailId) {
    document.getElementById('mainContent').innerHTML = '<div class="split-layout"><div class="split-main">' + html + '</div><div class="split-detail">' + detailHtml + '</div></div>';
  } else {
    document.getElementById('mainContent').innerHTML = html;
  }
}

    '</div>';

    ((u.changeHistory || []).length ? (u.changeHistory || []).slice().reverse().map(r => '<div class="hi"><div><b class="mono">' + fmtDate(r.date) + '</b><br>' + (r.changes || []).map(c => '<span class="note">• ' + esc(c) + '</span>').join('<br>') + '</div></div>').join('') : '<div class="note">No changes recorded yet — edits to isotope use and authorized users are logged automatically.</div>') + '</div></div>';
  h += '</div>';

function parseUsersText(text) {
  return text.split(',').map(t => t.trim()).filter(Boolean).map(t => {
    const m = t.match(/^(.*?)\s*\((.*?)\)\s*$/);
    return m ? { id: uid('u'), name: m[1].trim(), role: m[2].trim() } : { id: uid('u'), name: t, role: 'User' };
  });
}

      '<div data-gisos style="display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:8px">' + g.entries.map((e, i) => isoEntryHtml(e, i)).join('') + '</div></div>' +

    '<button class="btn btn-o" id="rfCancel">← Back to List</button>' +
    '<b style="font-size:14px;color:var(--txt)"><span class="acc">' + (editing ? '✏️' : '📋') + '</span> ' + (editing ? 'Edit RUA — ' + esc(editing.spaceID) : 'New Radiation Use Authorization') + '</b>' +
    '<span style="flex:1"></span>' +
    '<button class="btn btn-p" id="rfSubmitTop">' + saveLabel + '</button></div>';
  html += '<div class="card" style="padding:14px"><div style="display:grid;gap:12px">' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">' +
    '<div class="fi"><label>RUA No.</label><input id="rfNo" value="' + esc((editing && editing.ruaNo) || '') + '" placeholder="' + nextRuaNo() + '"><div class="hint">Leave blank to auto-assign on save</div></div>' +
    '<div class="fi"><label>Space ID *</label><select id="rfSpace">' + spaceOpts + '</select></div>' +
    '<div class="fi"><label>Authorization Type *</label><select id="rfType"><option ' + (editing && editing.type === 'Individual' ? '' : 'selected') + '>Communal</option><option ' + (editing && editing.type === 'Individual' ? 'selected' : '') + '>Individual</option></select></div>' +
    '<div class="fi"><label>Expiry Date * (renewed annually)</label><input type="date" id="rfExpiry" value="' + ((editing && editing.expiryDate) || addYearISO()) + '"><div class="hint">An alert is raised one month before expiry</div></div>' +
    '<div class="fi" id="rfPicWrap" style="display:' + (editing && editing.type === 'Individual' ? 'flex' : 'none') + '"><label>Person in Charge *</label><input id="rfPic" value="' + esc(editing && editing.personInCharge || '') + '" placeholder="Name of the person in charge"></div>' +
    '</div>' +
    '<div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:11px;text-transform:uppercase;color:var(--txt2)">PI Groups</b><button class="icobtn" id="rfAddGrp">+ Add Group</button></div><div id="rfGroups">' + groups.map(groupRowHtml).join('') + '</div></div>' +
    '<div><b style="font-size:11px;text-transform:uppercase;color:var(--txt2)">Safety Controls *</b><div class="hint" style="margin-bottom:6px">Required controls for this location</div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px">' + SAFETY_CONTROLS.map(c => '<label style="display:flex;align-items:center;gap:6px;font-size:12px"><input type="checkbox" class="rfCtl" value="' + c + '" ' + (selControls.includes(c) ? 'checked' : '') + '> ' + c + '</label>').join('') + '</div></div>' +
    '<div class="fi f" id="rfErrWrap" style="display:none"><div style="background:var(--red-l);color:var(--red);border-radius:6px;padding:8px 12px;font-size:11px" id="rfErr"></div></div>' +

  const closeEditor = () => { S.ruaEditId = null; renderAll(); };

  document.getElementById('rfCancel2').onclick = closeEditor;

  let groupCount = groups.length;
  function bindIsoDeletes(scope) {
    (scope || document).querySelectorAll('[data-deliso]').forEach(b => b.onclick = () => {
      const wrap = b.closest('[data-gisos]');
      if (wrap && wrap.querySelectorAll('.isoentry').length > 1) b.closest('.isoentry').remove();
    });
  }
  function bindGroupControls(scope) {
    (scope || document).querySelectorAll('[data-addiso]').forEach(btn => btn.onclick = () => {
      const wrap = btn.closest('.card').querySelector('[data-gisos]');
      const tmp = document.createElement('div');
      tmp.innerHTML = isoEntryHtml(Object.assign({}, EMPTY_ISO_ENTRY), wrap.querySelectorAll('.isoentry').length);
      wrap.appendChild(tmp.firstChild);
      bindIsoDeletes(wrap);
    });
    bindIsoDeletes(scope);
  }
  function bindGrpDeletes() {
    document.querySelectorAll('[data-delgrp]').forEach(b => b.onclick = () => {
      const rows = document.querySelectorAll('#rfGroups > .card');
      if (rows.length > 1) b.closest('.card').remove();
    });
  }
  function bindImportRoster() {
    document.querySelectorAll('[data-importroster]').forEach(btn => btn.onclick = () => {
      const idx = parseInt(btn.dataset.importroster);
      const card = document.querySelector('[data-grp="' + idx + '"]');
      if (!card) return;
      const input = card.querySelector('[data-gusers]');
      if (!input) return;
      const rosterNames = S.doseRoster.map(r => r.name + ' (User)');
      const existing = input.value ? input.value.split(',').map(s => s.trim()).filter(Boolean) : [];
      const existingNames = existing.map(s => s.replace(/\s*\([^)]*\)\s*$/, '').trim());
      const toAdd = rosterNames.filter(n => {
        const name = n.replace(/\s*\([^)]*\)\s*$/, '').trim();
        return !existingNames.includes(name);
      });
      if (toAdd.length === 0) {
        toast('All roster members already in the list');
        return;
      }
      const combined = existing.concat(toAdd);
      input.value = combined.join(', ');
      toast('📋 Added ' + toAdd.length + ' user(s) from Dosimetry Roster');
    });
  }
  document.getElementById('rfAddGrp').onclick = () => {
    const wrap = document.getElementById('rfGroups');
    const tmp = document.createElement('div');
    tmp.innerHTML = groupRowHtml({ piId: '', entries: [Object.assign({}, EMPTY_ISO_ENTRY)], usersText: '' }, groupCount++);
